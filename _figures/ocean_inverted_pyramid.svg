<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400"
     font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <title>대양의 역피라미드 — 현존량은 적지만 생산량은 크다</title>
  <desc>영양단계별 양을 좌우 가로막대로 나타내어, 어느 한 시점의 현존량은 생산자가 더 적지만 일정 기간 누적한 생산량은 생산자가 훨씬 크다는 것을 대비했다</desc>

  <defs>
    <pattern id="prod" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f2f5f1"/>
      <circle cx="2" cy="2" r="1.3" fill="#4f7259"/>
      <circle cx="6" cy="6" r="1.3" fill="#4f7259"/>
    </pattern>
    <pattern id="cons" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#e8efe9"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#1b4332" stroke-width="2.2"/>
    </pattern>
    <marker id="cy" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a1651a"/>
    </marker>
  </defs>

  <style>
    .ttl  { font-size: 20px; font-weight: 700; fill: #1b4332; text-anchor: middle; }
    .lv   { font-size: 15px; font-weight: 700; fill: #1b4332; text-anchor: end; }
    .val  { font-size: 14.5px; font-weight: 700; fill: #333; }
    .note { font-size: 15.5px; fill: #333; }
    .sub  { font-size: 14.5px; fill: #444; text-anchor: middle; }
    .frame{ fill: #fcfdfc; stroke: #ccd5ce; stroke-width: 1.2; }
    .axis { stroke: #333; stroke-width: 1.6; }
  </style>

  <!-- ═══════ 왼쪽 : 현존량(어느 한 시점) ═══════ -->
  <g transform="translate(0,0)">
    <rect class="frame" x="20" y="42" width="416" height="212" rx="6"/>
    <text class="ttl" x="228" y="30">현존량 (어느 한 시점의 양)</text>

    <line class="axis" x1="176" y1="60" x2="176" y2="236"/>

    <!-- 3차 -->
    <text class="lv" x="168" y="83">3차 소비자</text>
    <rect x="176" y="70" width="26" height="20" fill="url(#cons)" stroke="#1b4332" stroke-width="1.6"/>
    <!-- 2차 -->
    <text class="lv" x="168" y="117">2차 소비자</text>
    <rect x="176" y="104" width="52" height="20" fill="url(#cons)" stroke="#1b4332" stroke-width="1.6"/>
    <!-- 1차 -->
    <text class="lv" x="168" y="151">1차 소비자</text>
    <rect x="176" y="138" width="212" height="20" fill="url(#cons)" stroke="#1b4332" stroke-width="1.6"/>
    <!-- 생산자 : 더 짧다 -->
    <text class="lv" x="168" y="185">생산자</text>
    <rect x="176" y="172" width="118" height="20" fill="url(#prod)" stroke="#4f7259" stroke-width="1.8"/>

    <text class="val" x="396" y="152" fill="#a1651a">↑ 더 크다</text>
    <text class="val" x="302" y="186" fill="#a1651a">↓ 더 작다</text>

    <text class="sub" x="228" y="224">생산자 막대가 1차 소비자보다 짧다</text>
    <text class="sub" x="228" y="244" style="font-weight:700; fill:#a1651a">→ 역피라미드로 보인다</text>
  </g>

  <!-- ═══════ 오른쪽 : 생산량(일정 기간 누적) ═══════ -->
  <g transform="translate(444,0)">
    <rect class="frame" x="20" y="42" width="416" height="212" rx="6"/>
    <text class="ttl" x="228" y="30">생산량 (일정 기간 누적한 양)</text>

    <line class="axis" x1="176" y1="60" x2="176" y2="236"/>

    <text class="lv" x="168" y="83">3차 소비자</text>
    <rect x="176" y="70" width="18" height="20" fill="url(#cons)" stroke="#1b4332" stroke-width="1.6"/>
    <text class="lv" x="168" y="117">2차 소비자</text>
    <rect x="176" y="104" width="46" height="20" fill="url(#cons)" stroke="#1b4332" stroke-width="1.6"/>
    <text class="lv" x="168" y="151">1차 소비자</text>
    <rect x="176" y="138" width="126" height="20" fill="url(#cons)" stroke="#1b4332" stroke-width="1.6"/>
    <text class="lv" x="168" y="185">생산자</text>
    <rect x="176" y="172" width="238" height="20" fill="url(#prod)" stroke="#4f7259" stroke-width="1.8"/>

    <text class="sub" x="228" y="224">생산자 막대가 가장 길다</text>
    <text class="sub" x="228" y="244" style="font-weight:700; fill:#1b4332">→ 정상 피라미드가 된다</text>
  </g>

  <!-- ═══════ 아래 : 회전율 ═══════ -->
  <g transform="translate(0,270)">
    <rect class="frame" x="20" y="0" width="860" height="66" rx="6"/>
    <text class="note" x="40" y="26" font-weight="700" fill="#1b4332">회전율이 빠르기 때문이다</text>

    <!-- 순환 화살표 : 작은 현존량이 반복 생산된다 -->
    <g transform="translate(292,32)">
      <ellipse cx="0" cy="0" rx="30" ry="17" fill="url(#prod)" stroke="#4f7259" stroke-width="1.8"/>
      <text x="0" y="5" style="font-size:13px; text-anchor:middle; fill:#1b4332; font-weight:700">식물플랑크톤</text>
      <path d="M 34,-12 C 62,-26 62,26 34,12" stroke="#a1651a" stroke-width="2.4"
            fill="none" marker-end="url(#cy)"/>
      <text x="76" y="-16" style="font-size:13.5px; fill:#a1651a">세포분열 주기가</text>
      <text x="76" y="2" style="font-size:13.5px; fill:#a1651a">매우 짧아 계속</text>
      <text x="76" y="20" style="font-size:13.5px; fill:#a1651a">새로 생산된다</text>
    </g>

    <text class="note" x="500" y="30" style="font-size:14.5px">적은 현존량으로도 자기보다 훨씬 큰 규모의</text>
    <text class="note" x="500" y="52" style="font-size:14.5px">1차 소비자를 지속적으로 부양 → 어류 종다양성 유지</text>
  </g>

  <!-- 범례 -->
  <g transform="translate(40,388)">
    <rect x="0" y="-11" width="22" height="13" fill="url(#prod)" stroke="#4f7259" stroke-width="1.4"/>
    <text style="font-size:14px; fill:#333" x="28" y="0">생산자(식물플랑크톤)</text>
    <rect x="200" y="-11" width="22" height="13" fill="url(#cons)" stroke="#1b4332" stroke-width="1.4"/>
    <text style="font-size:14px; fill:#333" x="228" y="0">소비자</text>
  </g>
</svg>
