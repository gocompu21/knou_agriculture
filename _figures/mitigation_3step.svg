<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340"
     font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <title>미티게이션 3단계 — 회피·저감·대체</title>
  <desc>산림지역 도로 노선과 보호가치가 큰 서식처의 관계로 세 방안을 나타낸 평면도</desc>

  <defs>
    <!-- 보호가치가 큰 서식처: 성긴 점 채움 -->
    <pattern id="hab" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#f2f5f1"/>
      <circle cx="2" cy="2" r="1.05" fill="#6f8a76"/>
    </pattern>
    <!-- 대체서식지: 같은 점이되 밀도를 높여 '새로 조성'을 구분 -->
    <pattern id="habNew" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#eef4ef"/>
      <circle cx="2" cy="2" r="1.2" fill="#4f7259"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <style>
    .step  { font-size: 20px; font-weight: 700; fill: #1b4332; text-anchor: middle; }
    .habT  { font-size: 15px; font-weight: 700; fill: #33513c; text-anchor: middle; }
    .roadT { font-size: 14px; font-weight: 700; fill: #222; }
    .note  { font-size: 15.5px; fill: #333; text-anchor: middle; }
    .frame { fill: #fcfdfc; stroke: #ccd5ce; stroke-width: 1.2; }
    /* 도로: 굵은 회색 위에 흰 중앙선 */
    .roadBase { stroke: #3a3a3a; stroke-width: 15; fill: none; stroke-linecap: round; }
    .roadLine { stroke: #fff; stroke-width: 2; fill: none;
                stroke-dasharray: 9 8; stroke-linecap: butt; }
    /* 교량 구간: 상판만 남기고 지면과 떨어져 있음을 두 줄로 표현 */
    .bridge   { stroke: #3a3a3a; stroke-width: 15; fill: none; opacity: .35; }
    .bridgeEd { stroke: #1b1b1b; stroke-width: 1.6; fill: none; }
  </style>

  <!-- ─────────────── 회피 ─────────────── -->
  <g transform="translate(10,0)">
    <text class="step" x="140" y="28">① 회피</text>
    <rect class="frame" x="12" y="42" width="256" height="188" rx="6"/>

    <!-- 서식처 -->
    <path d="M 96,86 C 156,74 216,102 214,142 C 212,186 148,204 110,190
             C 74,177 62,120 96,86 Z"
          fill="url(#hab)" stroke="#4f7259" stroke-width="2"/>
    <text class="habT" x="140" y="146">서식처</text>

    <!-- 노선이 서식처 경계에서 충분히 떨어져 우회한다 -->
    <path class="roadBase" d="M 22,214 C 66,218 116,216 168,206
                              C 214,196 238,150 244,60"/>
    <path class="roadLine" d="M 22,214 C 66,218 116,216 168,206
                              C 214,196 238,150 244,60"/>
    <text class="roadT" x="24" y="196">도로</text>

    <text class="note" x="140" y="264">보호가치가 큰 지역을 건드리지 않고</text>
    <text class="note" x="140" y="286">노선을 그 바깥으로 돌린다</text>
  </g>

  <!-- ─────────────── 저감 ─────────────── -->
  <g transform="translate(310,0)">
    <text class="step" x="140" y="28">② 저감</text>
    <rect class="frame" x="12" y="42" width="256" height="188" rx="6"/>

    <path d="M 96,86 C 156,74 216,102 214,142 C 212,186 148,204 110,190
             C 74,177 62,120 96,86 Z"
          fill="url(#hab)" stroke="#4f7259" stroke-width="2"/>
    <text class="habT" x="140" y="176">서식처</text>

    <!-- 노선이 통과하되 서식처 구간은 교량이라 지면 훼손이 없다 -->
    <path class="roadBase" d="M 22,132 L 78,132"/>
    <path class="roadLine" d="M 22,132 L 78,132"/>
    <path class="roadBase" d="M 222,132 L 258,132"/>
    <path class="roadLine" d="M 222,132 L 258,132"/>

    <g>
      <path class="bridge"   d="M 78,132 L 222,132"/>
      <path class="bridgeEd" d="M 78,124.5 L 222,124.5"/>
      <path class="bridgeEd" d="M 78,139.5 L 222,139.5"/>
      <!-- 교각 -->
      <line x1="106" y1="139.5" x2="106" y2="152" stroke="#1b1b1b" stroke-width="3"/>
      <line x1="150" y1="139.5" x2="150" y2="152" stroke="#1b1b1b" stroke-width="3"/>
      <line x1="194" y1="139.5" x2="194" y2="152" stroke="#1b1b1b" stroke-width="3"/>
      <text class="roadT" x="112" y="116">교량 구간</text>
    </g>

    <text class="note" x="140" y="264">일부 통과하더라도 교량 등으로</text>
    <text class="note" x="140" y="286">훼손 면적을 최소한으로 줄인다</text>
  </g>

  <!-- ─────────────── 대체 ─────────────── -->
  <g transform="translate(610,0)">
    <text class="step" x="140" y="28">③ 대체</text>
    <rect class="frame" x="12" y="42" width="256" height="188" rx="6"/>

    <!-- 노선이 지나가 서식처가 둘로 잘렸다 -->
    <path d="M 92,88 C 142,78 190,96 200,118 L 74,118 C 76,104 82,92 92,88 Z"
          fill="url(#hab)" stroke="#4f7259" stroke-width="2"/>
    <path d="M 74,146 L 200,146 C 196,180 140,200 106,186
             C 84,177 74,162 74,146 Z"
          fill="url(#hab)" stroke="#4f7259" stroke-width="2"/>

    <path class="roadBase" d="M 20,132 L 262,132"/>
    <path class="roadLine" d="M 20,132 L 262,132"/>

    <!-- 잃은 면적 이상을 다른 곳에 새로 만든다.
         라벨은 영역 밖에 두어 도형을 가리지 않게 한다. -->
    <path d="M 204,60 C 236,50 260,64 257,82 C 254,101 224,107 210,97
             C 198,88 195,66 204,60 Z"
          fill="url(#habNew)" stroke="#2f5c40" stroke-width="2.2"/>
    <text class="habT" x="228" y="46" style="font-size:13.5px">대체서식지</text>
    <path d="M 150,154 C 174,150 190,124 200,100" stroke="#333" stroke-width="1.8"
          fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>

    <text class="note" x="140" y="264">훼손이 불가피하면 그 면적 이상을</text>
    <text class="note" x="140" y="286">다른 곳에 대체서식지로 조성한다</text>
  </g>
</svg>
