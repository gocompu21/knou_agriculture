<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470"
     font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <title>도서생물지리설 — 이입률·멸종률의 균형과 평형 종수</title>
  <desc>거리와 면적의 2×2 조합에 따른 평형 종수를 격자로 정리하고, 이입률과 멸종률이 교차하는 지점에서 종수가 평형을 이룸을 함께 나타냄</desc>

  <defs>
    <marker id="iar" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <pattern id="isle" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#eef3ef"/>
      <circle cx="2" cy="2" r="1.2" fill="#6f8a76"/>
    </pattern>
  </defs>

  <style>
    .hd    { font-size:18px; font-weight:700; fill:#1b4332; }
    .cell  { fill:#fcfdfc; stroke:#ccd5ce; stroke-width:1.4; }
    .cellB { fill:#f2f5f1; stroke:#a1651a; stroke-width:2.4; }
    .hdr   { fill:#1b4332; }
    .hdrT  { font-size:15px; font-weight:700; fill:#fff; text-anchor:middle; }
    .sideT { font-size:15px; font-weight:700; fill:#1b4332; text-anchor:middle; }
    .num   { font-size:22px; font-weight:700; fill:#1b4332; text-anchor:middle; }
    .numB  { font-size:22px; font-weight:700; fill:#a1651a; text-anchor:middle; }
    .cap   { font-size:13.5px; fill:#555; text-anchor:middle; }
    .ax    { stroke:#222; stroke-width:2; fill:none; }
    .imm   { stroke:#1b4332; stroke-width:3; fill:none; }
    .ext   { stroke:#a1651a; stroke-width:3; fill:none; stroke-dasharray:9 5; }
    .lab   { font-size:14.5px; font-weight:700; }
    .note  { font-size:15.5px; fill:#333; }
  </style>

  <!-- ═══════ 왼쪽: 2×2 격자 ═══════ -->
  <g transform="translate(0,0)">
    <text class="hd" x="26" y="30">거리와 면적의 조합에 따른 평형 종수</text>

    <!-- 열 머리 (거리) -->
    <rect class="hdr" x="150" y="46" width="160" height="34" rx="4"/>
    <text class="hdrT" x="230" y="69">육지에 가까움</text>
    <rect class="hdr" x="316" y="46" width="160" height="34" rx="4"/>
    <text class="hdrT" x="396" y="69">육지에서 멂</text>
    <text class="sideT" x="313" y="30" style="font-size:14.5px;">← 이입률을 결정 →</text>

    <!-- 행 머리 (면적) -->
    <rect class="hdr" x="26" y="86" width="116" height="106" rx="4"/>
    <text class="hdrT" x="84" y="132">면적이</text>
    <text class="hdrT" x="84" y="154">넓은 섬</text>
    <rect class="hdr" x="26" y="198" width="116" height="106" rx="4"/>
    <text class="hdrT" x="84" y="244">면적이</text>
    <text class="hdrT" x="84" y="266">좁은 섬</text>

    <!-- 셀 4개 -->
    <!-- 큰 + 가까움 : 최다 -->
    <rect class="cellB" x="150" y="86" width="160" height="106" rx="4"/>
    <ellipse cx="230" cy="126" rx="46" ry="26" fill="url(#isle)" stroke="#1b4332" stroke-width="2"/>
    <text class="numB" x="230" y="172">종수 가장 많음</text>

    <!-- 큰 + 멂 -->
    <rect class="cell" x="316" y="86" width="160" height="106" rx="4"/>
    <ellipse cx="396" cy="126" rx="46" ry="26" fill="url(#isle)" stroke="#4f7259" stroke-width="2"/>
    <text class="num" x="396" y="172" style="font-size:15px;">중간</text>

    <!-- 작은 + 가까움 -->
    <rect class="cell" x="150" y="198" width="160" height="106" rx="4"/>
    <ellipse cx="230" cy="238" rx="24" ry="14" fill="url(#isle)" stroke="#4f7259" stroke-width="2"/>
    <text class="num" x="230" y="284" style="font-size:15px;">중간</text>

    <!-- 작은 + 멂 : 최소 -->
    <rect class="cell" x="316" y="198" width="160" height="106" rx="4"/>
    <ellipse cx="396" cy="238" rx="24" ry="14" fill="url(#isle)" stroke="#4f7259" stroke-width="2"/>
    <text class="num" x="396" y="284" style="font-size:15px;">가장 적음</text>

    <!-- 셀 캡션 -->
    <text class="cap" x="230" y="322">이입 많고 멸종 적음</text>
    <text class="cap" x="396" y="322">이입 적고 멸종 적음</text>
    <text class="cap" x="230" y="340">이입 많고 멸종 많음</text>
    <text class="cap" x="396" y="340">이입 적고 멸종 많음</text>
    <line x1="150" y1="328" x2="476" y2="328" stroke="#e0e6e1" stroke-width="1"/>
  </g>

  <!-- ═══════ 오른쪽: 평형 그래프 ═══════ -->
  <g transform="translate(0,0)">
    <text class="hd" x="512" y="30">이입률과 멸종률의 균형점 = 평형 종수</text>

    <path class="ax" d="M 556,290 L 556,60"/>
    <path class="ax" d="M 556,290 L 866,290" marker-end="url(#iar)"/>
    <text class="lab" x="512" y="52" fill="#1b4332">비율</text>
    <text class="lab" x="792" y="314" fill="#222">섬의 종수 →</text>

    <!-- 이입률: 종수 늘수록 감소 (좌상 → 우하) -->
    <path class="imm" d="M 566,78 C 640,180 720,240 852,278"/>
    <text class="lab" x="574" y="72" fill="#1b4332">이입률</text>
    <text class="cap" x="612" y="108" style="text-anchor:start; font-size:13px;">육지에 가까울수록 높다</text>

    <!-- 멸종률: 종수 늘수록 증가 (좌하 → 우상) -->
    <path class="ext" d="M 566,284 C 680,262 770,196 852,74"/>
    <text class="lab" x="792" y="66" fill="#a1651a">멸종률</text>
    <text class="cap" x="700" y="270" style="text-anchor:start; font-size:13px; fill:#a1651a;">면적이 넓을수록 낮다</text>

    <!-- 교차점 -->
    <circle cx="722" cy="216" r="6" fill="#1b4332"/>
    <path d="M 722,216 L 722,290" stroke="#666" stroke-width="1.4" stroke-dasharray="5 5"/>
    <text class="lab" x="722" y="182" fill="#1b4332" text-anchor="middle">균형</text>
    <text class="cap" x="722" y="308" style="font-size:14px; font-weight:700; fill:#1b4332;">평형 종수</text>
  </g>

  <!-- ═══════ 하단 요약 ═══════ -->
  <g transform="translate(0,356)">
    <rect x="26" y="0" width="848" height="98" rx="6" fill="#f2f5f1" stroke="#ccd5ce"/>
    <text class="note" x="46" y="28">
      섬의 종수는 <tspan style="font-weight:700; fill:#1b4332;">새로운 종의 정착률(이입률)</tspan>과
      <tspan style="font-weight:700; fill:#a1651a;">기존 종의 소멸률(멸종률)</tspan>이 균형을 이루는 지점에서 동적 평형을 유지한다.
    </text>
    <text class="note" x="46" y="56">
      이입률은 <tspan style="font-weight:700;">육지와의 거리</tspan>에, 멸종률은 <tspan style="font-weight:700;">섬의 크기</tspan>에 좌우된다.
    </text>
    <text class="note" x="46" y="84">
      따라서 <tspan style="font-weight:700; fill:#1b4332;">면적이 크고 육지에 가까운 섬</tspan>에서 평형 종수가 가장 많으며, 이 원리가 보호지역 설계의 근거가 된다.
    </text>
  </g>
</svg>
