<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430"
     font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <title>하천차수도 — 유역 하계망의 차수 부여</title>
  <desc>유역 경계 안의 하계망을 굵기로 차수를 구분해 그리고, 차수가 올라가는 규칙을 오른쪽에 정리한 지도</desc>

  <defs>
    <!-- markerUnits="userSpaceOnUse" 로 두어야 굵은 선에서 화살표가 과대해지지 않는다 -->
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b4332"/>
    </marker>
  </defs>

  <!-- 스타일은 텍스트에만 클래스를 쓴다. 선·도형은 제시 속성으로 직접 지정해
       CSS를 해석하지 않는 렌더러에서도 fill="none" 이 유지되게 한다. -->
  <style>
    .ttl   { font-size: 20px; font-weight: 700; fill: #1b4332; }
    .lab   { font-size: 15px; fill: #1b4332; font-weight: 700; }
    .note  { font-size: 15.5px; fill: #333; }
    .small { font-size: 13.5px; fill: #4a4a4a; }
    .ordN  { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; }
  </style>

  <text class="ttl" x="18" y="30">하천차수도 — 유역 안에서 지류가 합쳐질 때마다 차수가 오른다</text>

  <!-- ───────── 왼쪽: 유역 평면도 ───────── -->
  <!-- 유역 경계를 능선처럼 닫힌 다각형으로 두어 '지도'임을 분명히 한다 -->
  <path d="M 46,72 L 176,52 L 300,66 L 396,58 L 470,96 L 486,190
           L 452,286 L 470,366 L 350,398 L 214,388 L 96,352 L 34,258 Z"
        fill="#f2f5f1" stroke="#6f8a76" stroke-width="2" stroke-dasharray="10 6"/>
  <text class="small" x="52" y="392">유역 경계(분수계)</text>

  <!-- 1차수: 다른 지류를 받지 않는 최상류 -->
  <g fill="none" stroke="#4f7259" stroke-width="1.8" stroke-linecap="round">
    <path d="M 96,96  L 132,140"/>
    <path d="M 176,84  L 148,132"/>
    <path d="M 232,90  L 236,146"/>
    <path d="M 300,92  L 268,144"/>
    <path d="M 372,88  L 350,140"/>
    <path d="M 434,116 L 396,152"/>
    <path d="M 66,196  L 118,206"/>
    <path d="M 78,258  L 124,238"/>
    <path d="M 168,332 L 200,290"/>
    <path d="M 240,308 L 268,300"/>
    <path d="M 412,306 L 372,300"/>
    <path d="M 350,362 L 386,344"/>
  </g>

  <!-- 2차수: 1차수끼리 합류 -->
  <g fill="none" stroke="#3d6250" stroke-width="3.4" stroke-linecap="round">
    <path d="M 132,140 L 148,132 L 160,184"/>   <!-- 좌상 -->
    <path d="M 236,146 L 268,144 L 262,198"/>   <!-- 중상 -->
    <path d="M 350,140 L 396,152 L 388,202"/>   <!-- 우상 -->
    <path d="M 118,206 L 124,238 L 178,256"/>   <!-- 좌중 -->
    <path d="M 200,290 L 268,300 L 300,318"/>   <!-- 좌하 -->
    <path d="M 372,300 L 386,344"/>             <!-- 우하 -->
  </g>

  <!-- 3차수: 2차수끼리 합류 -->
  <g fill="none" stroke="#2a5140" stroke-width="5.4" stroke-linecap="round">
    <path d="M 160,184 L 262,198 L 246,248"/>              <!-- 좌상+중상 → 3차수 -->
    <path d="M 388,202 L 370,262 L 300,318"/>              <!-- 우상 계열 → 3차수 -->
  </g>
  <!-- 좌중 2차수는 3차수 본류에 합류하되 차수를 올리지 못한다(2+3 → 3) -->
  <path d="M 178,256 L 246,248" fill="none" stroke="#3d6250"
        stroke-width="3.4" stroke-linecap="round"/>

  <!-- 4차수: 3차수끼리 합류 → 본류로 유역을 빠져나간다 -->
  <path d="M 246,248 L 300,318 L 352,352 L 404,384"
        fill="none" stroke="#1b4332" stroke-width="7.6" stroke-linecap="round"
        marker-end="url(#flow)"/>
  <!-- 하류 좌우에서 들어오는 지류 -->
  <path d="M 262,352 L 300,318" fill="none" stroke="#4f7259"
        stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 386,344 L 352,352" fill="none" stroke="#3d6250"
        stroke-width="3.4" stroke-linecap="round"/>

  <!-- 차수 배지 — 하천 선 옆에 두어 선을 가리지 않는다 -->
  <g>
    <circle cx="102" cy="116" r="10" fill="#4f7259"/><text class="ordN" x="102" y="121">1</text>
    <circle cx="330" cy="110" r="10" fill="#4f7259"/><text class="ordN" x="330" y="115">1</text>
    <circle cx="184" cy="162" r="10" fill="#3d6250"/><text class="ordN" x="184" y="167">2</text>
    <circle cx="300" cy="172" r="10" fill="#3d6250"/><text class="ordN" x="300" y="177">2</text>
    <circle cx="212" cy="218" r="10" fill="#2a5140"/><text class="ordN" x="212" y="223">3</text>
    <circle cx="356" cy="254" r="10" fill="#2a5140"/><text class="ordN" x="356" y="259">3</text>
    <circle cx="290" cy="356" r="10" fill="#1b4332"/><text class="ordN" x="290" y="361">4</text>
  </g>
  <text class="lab" x="418" y="380">본류 유출구</text>

  <!-- ───────── 오른쪽: 차수 부여 규칙 ───────── -->
  <g transform="translate(524,0)">
    <rect x="0" y="52" width="358" height="346" rx="8" fill="#fcfdfc"
          stroke="#ccd5ce" stroke-width="1.2"/>
    <text class="lab" x="20" y="82">차수를 매기는 규칙</text>

    <!-- 규칙 1 -->
    <g fill="none" stroke="#4f7259" stroke-width="1.8" stroke-linecap="round">
      <path d="M 26,118 L 60,118"/>
      <path d="M 26,140 L 60,140"/>
    </g>
    <text class="note" x="74" y="124">최상류의 물줄기 = <tspan font-weight="700">1차수</tspan></text>
    <text class="small" x="74" y="146">다른 지류를 받지 않는 하천</text>

    <!-- 규칙 2 -->
    <g fill="none" stroke-linecap="round">
      <path d="M 26,196 L 52,208" stroke="#4f7259" stroke-width="1.8"/>
      <path d="M 26,220 L 52,208" stroke="#4f7259" stroke-width="1.8"/>
      <path d="M 52,208 L 64,208" stroke="#3d6250" stroke-width="3.4"/>
    </g>
    <text class="note" x="80" y="202">같은 차수끼리 만나면</text>
    <text class="note" x="80" y="224"><tspan font-weight="700">한 단계 올라간다</tspan> (1+1 → 2)</text>

    <!-- 규칙 3 -->
    <g fill="none" stroke-linecap="round">
      <path d="M 26,282 L 52,294" stroke="#3d6250" stroke-width="3.4"/>
      <path d="M 26,306 L 52,294" stroke="#4f7259" stroke-width="1.8"/>
      <path d="M 52,294 L 64,294" stroke="#3d6250" stroke-width="3.4"/>
    </g>
    <text class="note" x="80" y="288">차수가 다르면 <tspan font-weight="700">큰 쪽을</tspan></text>
    <text class="note" x="80" y="310"><tspan font-weight="700">그대로 유지</tspan>한다 (2+1 → 2)</text>

    <line x1="20" y1="336" x2="338" y2="336" stroke="#ccd5ce" stroke-width="1.2"/>
    <text class="small" x="20" y="362">차수가 클수록 지류가 많고 유역 규모가 크다.</text>
    <text class="small" x="20" y="382">그림에서는 선을 굵게 그려 차수를 나타냈다.</text>
  </g>
</svg>
