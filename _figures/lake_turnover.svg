<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430"
     font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <title>북반구 호소의 성층과 역전현상</title>
  <desc>여름 성층기·봄가을 전도기·겨울 성층기 세 시기의 수직 층 구조를 나란히 놓고, 층간 밀도차가 사라질 때 전 수심이 순환하는 것을 나타냈다</desc>

  <defs>
    <!-- 표수층 : 성긴 가로 물결 -->
    <pattern id="epi" width="18" height="14" patternUnits="userSpaceOnUse">
      <rect width="18" height="14" fill="#f8fbf9"/>
      <path d="M0,8 q4.5,-4 9,0 q4.5,4 9,0" stroke="#9dbaa7" stroke-width="1.1" fill="none"/>
    </pattern>
    <!-- 수온약층 : 촘촘한 사선 (밀도 장벽) -->
    <pattern id="meta" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="11" height="11" fill="#f4f1ec"/>
      <line x1="0" y1="0" x2="0" y2="11" stroke="#c08a45" stroke-width="1.8"/>
    </pattern>
    <!-- 심수층 : 진한 점 -->
    <pattern id="hypo" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#eaf0ec"/>
      <circle cx="3.5" cy="3.5" r="1.5" fill="#5c7a66"/>
      <circle cx="10.5" cy="10.5" r="1.5" fill="#5c7a66"/>
    </pattern>
    <!-- 전도기 : 균일하게 섞인 물 -->
    <pattern id="mix" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f2f7f3"/>
      <circle cx="4" cy="4" r="1.4" fill="#7d9a86"/>
      <path d="M0,11 q4,-3.5 8,0 q4,3.5 8,0" stroke="#7d9a86" stroke-width="1.1" fill="none"/>
    </pattern>
    <marker id="mx" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a1651a"/>
    </marker>
    <marker id="wd" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <style>
    .ttl  { font-size: 19px; font-weight: 700; fill: #1b4332; text-anchor: middle; }
    .lyr  { font-size: 15px; font-weight: 700; fill: #1b4332; }
    .tmp  { font-size: 13.5px; fill: #444; text-anchor: end; }
    .note { font-size: 15.5px; fill: #333; }
    .cap  { font-size: 14.5px; fill: #333; text-anchor: middle; }
    .box  { fill: none; stroke: #4f7259; stroke-width: 2; }
  </style>

  <!-- ══════ 여름 성층기 ══════ -->
  <g transform="translate(24,0)">
    <text class="ttl" x="128" y="28">여름 — 성층 형성</text>
    <rect x="10" y="44" width="236" height="216" fill="#fff" stroke="#ccd5ce" stroke-width="1.2" rx="4"/>

    <rect x="10" y="44" width="236" height="70" fill="url(#epi)"/>
    <rect x="10" y="114" width="236" height="52" fill="url(#meta)"/>
    <rect x="10" y="166" width="236" height="94" fill="url(#hypo)"/>
    <line x1="10" y1="114" x2="246" y2="114" stroke="#a1651a" stroke-width="2.2"/>
    <line x1="10" y1="166" x2="246" y2="166" stroke="#a1651a" stroke-width="2.2"/>
    <rect class="box" x="10" y="44" width="236" height="216" rx="4"/>

    <text class="lyr" x="22" y="68">표수층</text>
    <text class="tmp" x="238" y="68">20℃ · 밀도 낮음</text>
    <text class="tmp" x="238" y="102">수온 높고 가볍다</text>

    <text class="lyr" x="22" y="134">수온약층</text>
    <text class="tmp" x="238" y="134">수온 급변 · 밀도 장벽</text>

    <text class="lyr" x="22" y="190">심수층</text>
    <text class="tmp" x="238" y="190">4℃ · 밀도 높음</text>
    <text class="tmp" x="238" y="248">수온 낮고 무겁다</text>

    <!-- 섞이지 않음 -->
    <path d="M 128,96 L 128,124" stroke="#a1651a" stroke-width="2.6" fill="none"/>
    <path d="M 116,128 L 140,152" stroke="#a1651a" stroke-width="3"/>
    <path d="M 140,128 L 116,152" stroke="#a1651a" stroke-width="3"/>

    <text class="cap" x="128" y="284">밀도 차가 커서 위아래가</text>
    <text class="cap" x="128" y="304">섞이지 않는다</text>
  </g>

  <!-- ══════ 봄·가을 전도기 ══════ -->
  <g transform="translate(320,0)">
    <text class="ttl" x="128" y="28">봄·가을 — 역전(전도)</text>
    <rect x="10" y="44" width="236" height="216" fill="url(#mix)" stroke="#ccd5ce" stroke-width="1.2" rx="4"/>
    <rect class="box" x="10" y="44" width="236" height="216" rx="4"/>

    <!-- 수온약층이 사라졌음을 회색 파선으로 -->
    <line x1="10" y1="114" x2="246" y2="114" stroke="#9aa39c" stroke-width="1.6" stroke-dasharray="6 6"/>
    <line x1="10" y1="166" x2="246" y2="166" stroke="#9aa39c" stroke-width="1.6" stroke-dasharray="6 6"/>
    <text class="tmp" x="238" y="110" style="font-size:12.5px">수온약층 소멸</text>

    <!-- 바람 -->
    <path d="M 24,36 L 120,36" stroke="#333" stroke-width="2.2" fill="none" marker-end="url(#wd)"/>
    <text class="tmp" x="128" y="40" style="text-anchor:start">바람</text>

    <!-- 순환 화살표 : 전 수심 -->
    <path d="M 66,84 C 34,140 34,180 66,228" stroke="#a1651a" stroke-width="2.6"
          fill="none" marker-end="url(#mx)"/>
    <path d="M 190,228 C 222,180 222,140 190,84" stroke="#a1651a" stroke-width="2.6"
          fill="none" marker-end="url(#mx)"/>
    <path d="M 78,238 L 178,238" stroke="#a1651a" stroke-width="2.6" fill="none" marker-end="url(#mx)"/>
    <path d="M 178,74 L 78,74" stroke="#a1651a" stroke-width="2.6" fill="none" marker-end="url(#mx)"/>

    <text class="lyr" x="128" y="150" style="text-anchor:middle">전 수심 순환</text>
    <text class="tmp" x="128" y="176" style="text-anchor:middle; font-size:13.5px">수온 4℃로 균일</text>

    <text class="cap" x="128" y="284">표층 수온이 4℃에 가까워져</text>
    <text class="cap" x="128" y="304">밀도 차가 사라지면 섞인다</text>
  </g>

  <!-- ══════ 겨울 성층기 ══════ -->
  <g transform="translate(616,0)">
    <text class="ttl" x="128" y="28">겨울 — 역성층</text>
    <rect x="10" y="44" width="236" height="216" fill="#fff" stroke="#ccd5ce" stroke-width="1.2" rx="4"/>

    <rect x="10" y="44" width="236" height="20" fill="#dfe7ea" stroke="#7d97a0" stroke-width="1.4"/>
    <rect x="10" y="64" width="236" height="56" fill="url(#epi)"/>
    <rect x="10" y="120" width="236" height="140" fill="url(#hypo)"/>
    <line x1="10" y1="120" x2="246" y2="120" stroke="#a1651a" stroke-width="2.2"/>
    <rect class="box" x="10" y="44" width="236" height="216" rx="4"/>

    <text class="lyr" x="22" y="59" style="font-size:13.5px">결빙(0℃)</text>
    <text class="lyr" x="22" y="92">표수층</text>
    <text class="tmp" x="238" y="92">0~3℃ · 가볍다</text>
    <text class="lyr" x="22" y="146">심수층</text>
    <text class="tmp" x="238" y="146">4℃ · 가장 무겁다</text>
    <text class="tmp" x="238" y="248" style="font-size:13px">물은 4℃에서 밀도 최대</text>

    <path d="M 128,96 L 128,112" stroke="#a1651a" stroke-width="2.6" fill="none"/>
    <path d="M 116,116 L 140,140" stroke="#a1651a" stroke-width="3"/>
    <path d="M 140,116 L 116,140" stroke="#a1651a" stroke-width="3"/>

    <text class="cap" x="128" y="284">찬 물이 위, 4℃ 물이 아래로</text>
    <text class="cap" x="128" y="304">여름과 반대의 성층이 된다</text>
  </g>

  <!-- 생태적 의의 -->
  <rect x="24" y="326" width="852" height="88" rx="6" fill="#f2f5f1" stroke="#4f7259" stroke-width="1.6"/>
  <text class="note" x="42" y="352" font-weight="700" fill="#1b4332">역전현상의 생태적 의의</text>
  <text class="note" x="42" y="378">· 표층의 <tspan font-weight="700">용존산소</tspan>가 심층으로 내려가 심층 생물의 호흡 조건이 회복된다.</text>
  <text class="note" x="42" y="402">· 심층의 <tspan font-weight="700">영양염류</tspan>가 표층으로 올라와 호소 전체의 물질순환이 회복된다.</text>
</svg>
