<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"
     font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <title>식생보전등급 — 평가항목과 1~5등급</title>
  <desc>왼쪽에 다섯 가지 평가항목을 입력으로 두고, 오른쪽에 자연성이 높은 순으로 1등급부터 5등급까지를 계단형 사다리로 배열한 뒤 핵심·완충·전이 지역 대응을 괄호로 묶은 그림</desc>

  <defs>
    <marker id="vm" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f7259"/>
    </marker>
  </defs>

  <style>
    .h    { font-size: 19px; font-weight: 700; fill: #1b4332; }
    .item { font-size: 15px; fill: #222; }
    .gn   { font-size: 16px; font-weight: 700; text-anchor: middle; }
    .gd   { font-size: 15px; }
    .zone { font-size: 15px; font-weight: 700; fill: #a1651a; }
    .sc   { font-size: 14px; fill: #555; }
  </style>

  <!-- ── 좌: 평가항목 ── -->
  <text class="h" x="20" y="30">① 평가항목 (5가지 종합 판정)</text>
  <rect x="20" y="44" width="266" height="252" rx="6"
        fill="#f2f5f1" stroke="#ccd5ce" stroke-width="1.3"/>
  <g class="item">
    <circle cx="44" cy="80"  r="5" fill="#1b4332"/><text x="60" y="86">분포희귀성</text>
    <circle cx="44" cy="128" r="5" fill="#1b4332"/><text x="60" y="134">식생복원 잠재성</text>
    <circle cx="44" cy="176" r="5" fill="#1b4332"/><text x="60" y="182">구성식물종 온전성</text>
    <circle cx="44" cy="224" r="5" fill="#1b4332"/><text x="60" y="230">중요종 서식</text>
    <circle cx="44" cy="272" r="5" fill="#1b4332"/><text x="60" y="278">식재림 흉고직경</text>
  </g>

  <line x1="292" y1="170" x2="340" y2="170" stroke="#4f7259" stroke-width="3"
        marker-end="url(#vm)"/>
  <text x="316" y="158" font-size="13.5" fill="#4f7259" text-anchor="middle">종합</text>

  <!-- ── 우: 등급 사다리 (위가 자연성 높음) ── -->
  <text class="h" x="352" y="30">② 등급 — 자연성이 높을수록 상위 등급</text>

  <!-- 자연성 축 -->
  <line x1="362" y1="296" x2="362" y2="44" stroke="#a1651a" stroke-width="2"
        marker-end="url(#vm)"/>
  <text x="0" y="0" transform="translate(354,180) rotate(-90)"
        font-size="13.5" fill="#a1651a" text-anchor="middle">인위적 간섭 적음 · 자연성 높음 →</text>

  <!-- 계단형: 상위 등급일수록 오른쪽 폭이 길고 채움이 진하다 -->
  <g>
    <rect x="376" y="44"  width="330" height="46" fill="#1b4332" stroke="#1b4332" stroke-width="1.6"/>
    <text class="gn" x="418" y="74" fill="#ffffff">1등급</text>
    <text class="gd" x="452" y="74" fill="#ffffff">극상림, 자연림, 자연성</text>

    <rect x="376" y="94"  width="298" height="46" fill="#3d6350" stroke="#1b4332" stroke-width="1.6"/>
    <text class="gn" x="418" y="124" fill="#ffffff">2등급</text>
    <text class="gd" x="452" y="124" fill="#ffffff">2차 천이 후 회복식생</text>

    <rect x="376" y="144" width="266" height="46" fill="#7d9a86" stroke="#1b4332" stroke-width="1.6"/>
    <text class="gn" x="418" y="174" fill="#ffffff">3등급</text>
    <text class="gd" x="452" y="174" fill="#ffffff">교란 후 2차 천이 초기식생</text>

    <rect x="376" y="194" width="234" height="46" fill="#c3d4c8" stroke="#1b4332" stroke-width="1.6"/>
    <text class="gn" x="418" y="224" fill="#1b4332">4등급</text>
    <text class="gd" x="452" y="224" fill="#1b4332">조림지</text>

    <rect x="376" y="244" width="202" height="46" fill="#ffffff" stroke="#1b4332" stroke-width="1.6"/>
    <text class="gn" x="418" y="274" fill="#1b4332">5등급</text>
    <text class="gd" x="452" y="274" fill="#1b4332">초원, 경작지, 주거지</text>
  </g>

  <!-- 구역 대응 브래킷 -->
  <g stroke="#a1651a" stroke-width="2.2" fill="none">
    <path d="M 726,46 L 742,46 L 742,138 L 726,138"/>
    <path d="M 726,146 L 742,146 L 742,238 L 726,238"/>
    <path d="M 726,246 L 742,246 L 742,288 L 726,288"/>
  </g>
  <text class="zone" x="752" y="98">핵심지역</text>
  <text class="zone" x="752" y="198">완충지역</text>
  <text class="zone" x="752" y="273">전이지역</text>

  <text class="sc" x="20" y="336">※ 다섯 항목을 종합해 1~5등급을 판정하며, 인위적 간섭이 적어 자연성이 높을수록 상위 등급을 부여한다.</text>
  <text class="sc" x="20" y="360">※ 1·2등급은 핵심지역, 3·4등급은 완충지역, 5등급은 전이지역에 대응한다.</text>
  <text class="sc" x="20" y="384">※ 막대의 채움이 진하고 길수록 자연성과 보전 필요성이 높다.</text>
</svg>
