<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400"
     font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <title>우수순환체계 — 집수부터 재이용까지</title>
  <desc>빗물이 집수·쇄석여과층·저류연못·침투연못을 차례로 지나 배수되고, 남은 물은 2차 저류조에 담겼다가 다시 쓰이는 흐름을 단계 카드로 나타낸 개념도</desc>

  <defs>
    <!-- 자갈층 -->
    <pattern id="grav" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#f1f3f0"/>
      <circle cx="3" cy="3" r="2.2" fill="none" stroke="#5a6b5e" stroke-width="1.2"/>
      <circle cx="8" cy="8" r="1.7" fill="none" stroke="#5a6b5e" stroke-width="1.2"/>
    </pattern>
    <!-- 물 -->
    <pattern id="wat" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#eef3f5"/>
      <path d="M0,5 q2,-3 4,0 t4,0" fill="none" stroke="#5b7d8a" stroke-width="1.1"/>
    </pattern>
    <!-- 토양(침투) -->
    <pattern id="soil" width="7" height="7" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#f4f2ee"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#8a7a5e" stroke-width="1.3"/>
    </pattern>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b4332"/>
    </marker>
    <marker id="flo" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a1651a"/>
    </marker>
    <marker id="dn" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b7d8a"/>
    </marker>
  </defs>

  <style>
    .ttl  { font-size: 20px; font-weight: 700; fill: #1b4332; }
    .num  { font-size: 15px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .stg  { font-size: 15px; font-weight: 700; fill: #1b4332; text-anchor: middle; }
    .dsc  { font-size: 13.5px; fill: #333; text-anchor: middle; }
    .card { fill: #fcfdfc; stroke: #9fb3a4; stroke-width: 1.5; }
    .flow { stroke: #1b4332; stroke-width: 2.6; fill: none; }
    .reuse{ stroke: #a1651a; stroke-width: 2.6; fill: none; stroke-dasharray: 10 6; }
    .lb   { font-size: 14px; font-weight: 700; fill: #a1651a; }
  </style>

  <text class="ttl" x="20" y="30">우수순환체계 — 모아서 거르고, 가두고, 스미게 하고, 다시 쓴다</text>

  <!-- ─── 단계 카드 5개 ─── -->
  <!-- ① 집수 -->
  <g transform="translate(24,60)">
    <rect class="card" x="0" y="0" width="152" height="152" rx="8"/>
    <!-- 지붕과 포장면에서 빗물이 모인다 -->
    <path d="M 24,86 L 62,54 L 100,86" fill="none" stroke="#3f5a47" stroke-width="2.4"/>
    <rect x="34" y="86" width="56" height="30" fill="#f2f5f1" stroke="#3f5a47" stroke-width="1.6"/>
    <rect x="104" y="106" width="34" height="10" fill="#eceee9" stroke="#5a5a5a" stroke-width="1.4"/>
    <g stroke="#5b7d8a" stroke-width="1.8" marker-end="url(#dn)">
      <line x1="34" y1="26" x2="34" y2="48"/>
      <line x1="62" y1="20" x2="62" y2="42"/>
      <line x1="92" y1="26" x2="92" y2="48"/>
      <line x1="120" y1="70" x2="120" y2="96"/>
    </g>
    <circle cx="16" cy="16" r="12" fill="#1b4332"/><text class="num" x="16" y="21">①</text>
    <text class="stg" x="76" y="138">집수</text>
    <text class="dsc" x="76" y="176">지붕·포장면의 빗물을</text>
    <text class="dsc" x="76" y="194">한곳으로 모은다</text>
  </g>

  <!-- ② 쇄석여과층 -->
  <g transform="translate(196,60)">
    <rect class="card" x="0" y="0" width="152" height="152" rx="8"/>
    <rect x="26" y="52" width="100" height="54" fill="url(#grav)" stroke="#5a6b5e" stroke-width="1.8"/>
    <line x1="18" y1="44" x2="134" y2="44" stroke="#5b7d8a" stroke-width="2.4"/>
    <text class="dsc" x="76" y="38" style="font-size:12.5px">초기 빗물</text>
    <g stroke="#5b7d8a" stroke-width="1.6" marker-end="url(#dn)">
      <line x1="50" y1="108" x2="50" y2="126"/>
      <line x1="76" y1="108" x2="76" y2="126"/>
      <line x1="102" y1="108" x2="102" y2="126"/>
    </g>
    <circle cx="16" cy="16" r="12" fill="#1b4332"/><text class="num" x="16" y="21">②</text>
    <text class="stg" x="76" y="146">쇄석여과층</text>
    <text class="dsc" x="76" y="176">오염물질 많은 초기 빗물을</text>
    <text class="dsc" x="76" y="194">자갈층으로 걸러 낸다</text>
  </g>

  <!-- ③ 저류연못 -->
  <g transform="translate(368,60)">
    <rect class="card" x="0" y="0" width="152" height="152" rx="8"/>
    <!-- 물을 가두는 연못. 바닥이 막혀 스미지 않는다 -->
    <path d="M 22,60 C 44,104 108,104 130,60 L 130,110 C 108,124 44,124 22,110 Z"
          fill="url(#wat)" stroke="#4f7259" stroke-width="2"/>
    <line x1="22" y1="112" x2="130" y2="112" stroke="#1b4332" stroke-width="3"/>
    <text class="dsc" x="76" y="130" style="font-size:12px">바닥 차수 — 스미지 않음</text>
    <!-- 수변 식생 -->
    <g stroke="#3f5a47" stroke-width="1.6" fill="none">
      <path d="M 28,60 l -3,-16 M 33,60 l 2,-14 M 120,60 l 3,-15 M 114,60 l -2,-13"/>
    </g>
    <circle cx="16" cy="16" r="12" fill="#1b4332"/><text class="num" x="16" y="21">③</text>
    <text class="stg" x="76" y="44">저류연못</text>
    <text class="dsc" x="76" y="176">유출을 늦추면서</text>
    <text class="dsc" x="76" y="194">수변 서식환경을 만든다</text>
  </g>

  <!-- ④ 침투연못 -->
  <g transform="translate(540,60)">
    <rect class="card" x="0" y="0" width="152" height="152" rx="8"/>
    <path d="M 22,60 C 44,104 108,104 130,60 L 130,106 C 108,120 44,120 22,106 Z"
          fill="url(#wat)" stroke="#4f7259" stroke-width="2"/>
    <!-- 바닥이 열려 땅속으로 스민다 -->
    <rect x="22" y="108" width="108" height="26" fill="url(#soil)" stroke="none"/>
    <g stroke="#5b7d8a" stroke-width="1.6" marker-end="url(#dn)">
      <line x1="44" y1="110" x2="44" y2="132"/>
      <line x1="66" y1="112" x2="66" y2="134"/>
      <line x1="88" y1="112" x2="88" y2="134"/>
      <line x1="110" y1="110" x2="110" y2="132"/>
    </g>
    <g stroke="#3f5a47" stroke-width="1.6" fill="none">
      <path d="M 28,60 l -3,-16 M 34,60 l 2,-14 M 40,62 l -2,-12
               M 118,60 l 3,-15 M 112,60 l -2,-13 M 106,62 l 2,-12"/>
    </g>
    <circle cx="16" cy="16" r="12" fill="#1b4332"/><text class="num" x="16" y="21">④</text>
    <text class="stg" x="76" y="44">침투연못</text>
    <text class="dsc" x="76" y="176">담아 두면서 땅속으로 침투</text>
    <text class="dsc" x="76" y="194">저류·정수·서식 기능을 겸한다</text>
  </g>

  <!-- ⑤ 2차 저류 -->
  <g transform="translate(712,60)">
    <rect class="card" x="0" y="0" width="164" height="152" rx="8"/>
    <!-- 지하 저류조 -->
    <rect x="30" y="56" width="104" height="66" fill="url(#wat)"
          stroke="#3a3a3a" stroke-width="2.6"/>
    <line x1="30" y1="74" x2="134" y2="74" stroke="#5b7d8a" stroke-width="1.6"/>
    <text class="dsc" x="82" y="98" style="font-size:12.5px">저장</text>
    <!-- 재이용 용도 -->
    <text class="dsc" x="82" y="140" style="font-size:12px">화장실용수·관수·세차·보충수</text>
    <circle cx="16" cy="16" r="12" fill="#1b4332"/><text class="num" x="16" y="21">⑤</text>
    <text class="stg" x="82" y="44">2차 저류</text>
    <text class="dsc" x="82" y="176">남은 빗물을 저장했다가</text>
    <text class="dsc" x="82" y="194">다시 쓴다</text>
  </g>

  <!-- ─── 단계 사이 흐름 화살표 ─── -->
  <g>
    <line class="flow" x1="178" y1="136" x2="192" y2="136" marker-end="url(#fl)"/>
    <line class="flow" x1="350" y1="136" x2="364" y2="136" marker-end="url(#fl)"/>
    <line class="flow" x1="522" y1="136" x2="536" y2="136" marker-end="url(#fl)"/>
    <line class="flow" x1="694" y1="136" x2="708" y2="136" marker-end="url(#fl)"/>
  </g>

  <!-- ─── 재이용 순환 : 오른쪽 끝에서 앞단으로 되돌아온다 ─── -->
  <path class="reuse" d="M 794,272 L 794,336 L 100,336 L 100,236"
        marker-end="url(#flo)"/>
  <text class="lb" x="374" y="360">재이용 — 순환이 닫힌다</text>

  <!-- 배수(초과분) : ④ 아래에서 갈라져 오른쪽 밖으로 빠진다 -->
  <path class="flow" d="M 616,212 L 616,300 L 800,300" marker-end="url(#fl)"/>
  <text class="dsc" x="726" y="292" style="font-size:13px">초과분은 배수</text>
</svg>
