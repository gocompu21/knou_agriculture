<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"
     font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <title>생물권보전지역의 세 구역 — 핵심·완충·협력</title>
  <desc>왼쪽은 실제 지형에 세 구역을 배치한 평면 지도, 오른쪽은 같은 배치를 가로 단면으로 본 것. 핵심구역이 안쪽, 협력구역이 바깥이라는 순서는 동일하다</desc>

  <defs>
    <!-- 핵심구역 : 가장 촘촘한 사선 (엄정 보전) -->
    <pattern id="core" width="5" height="5" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#dfe9e1"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1b4332" stroke-width="2.2"/>
    </pattern>
    <!-- 완충구역 : 성긴 사선 -->
    <pattern id="buf" width="9" height="9" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#eef3ef"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#4f7259" stroke-width="1.6"/>
    </pattern>
    <!-- 협력구역 : 점 (주민 생활) -->
    <pattern id="coop" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#f8faf8"/>
      <circle cx="4.5" cy="4.5" r="1.2" fill="#8aa392"/>
    </pattern>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a1651a"/>
    </marker>
  </defs>

  <style>
    .ttl { font-size: 20px; font-weight: 700; fill: #1b4332; }
    .cap { font-size: 15px; font-weight: 700; fill: #1b4332; }
    .zn  { font-size: 15px; font-weight: 700; fill: #1b4332; }
    .dsc { font-size: 13.5px; fill: #333; }
    .sm  { font-size: 13px; fill: #555; }
    .lead{ stroke: #333; stroke-width: 1.3; fill: none; }
  </style>

  <text class="ttl" x="20" y="30">생물권보전지역의 세 구역 — 안에서 밖으로 이용 강도가 커진다</text>

  <!-- ═════ 왼쪽 : 평면 지도 ═════ -->
  <g transform="translate(20,48)">
    <text class="cap" x="0" y="16">［평면］ 구역 배치</text>

    <!-- 협력구역 : 바깥 전체. 마을·농경지가 든 불규칙한 경계 -->
    <path d="M 22,40 C 90,22 180,26 246,40 C 316,54 350,110 340,178
             C 330,248 262,286 186,288 C 108,290 40,262 20,196
             C 4,142 6,72 22,40 Z"
          fill="url(#coop)" stroke="#6f8a76" stroke-width="1.8"/>

    <!-- 완충구역 -->
    <path d="M 72,74 C 128,58 202,62 250,84 C 292,104 300,158 282,196
             C 262,238 200,254 148,246 C 96,238 58,204 54,158
             C 51,122 56,88 72,74 Z"
          fill="url(#buf)" stroke="#4f7259" stroke-width="2" stroke-dasharray="8 5"/>

    <!-- 핵심구역 -->
    <path d="M 126,110 C 170,98 218,110 232,142 C 244,172 224,208 186,214
             C 148,220 112,198 106,168 C 101,142 108,118 126,110 Z"
          fill="url(#core)" stroke="#1b4332" stroke-width="2.4"/>

    <!-- 라벨 : 흰 판을 깔아 패턴 위에서도 읽히게 한다 -->
    <g>
      <rect x="138" y="150" width="56" height="24" rx="4" fill="#fff"
            stroke="#1b4332" stroke-width="1.4"/>
      <text class="zn" x="146" y="168">핵심</text>
    </g>
    <g>
      <rect x="66" y="216" width="56" height="24" rx="4" fill="#fff"
            stroke="#4f7259" stroke-width="1.4"/>
      <text class="zn" x="74" y="234">완충</text>
    </g>
    <g>
      <rect x="30" y="56" width="56" height="24" rx="4" fill="#fff"
            stroke="#6f8a76" stroke-width="1.4"/>
      <text class="zn" x="38" y="74">협력</text>
    </g>

    <!-- 협력구역의 마을 : 이용이 이루어짐을 작은 집 기호로 -->
    <g stroke="#5a5a5a" stroke-width="1.5" fill="#fff">
      <path d="M 268,232 l 11,-9 l 11,9 v 13 h -22 Z"/>
      <path d="M 296,252 l 9,-8 l 9,8 v 11 h -18 Z"/>
      <path d="M 44,120 l 10,-8 l 10,8 v 12 h -20 Z"/>
    </g>
    <text class="sm" x="228" y="318">↑ 마을·농경지 (협력구역)</text>
  </g>

  <!-- ═════ 오른쪽 : 가로 단면 + 설명 ═════ -->
  <g transform="translate(400,48)">
    <text class="cap" x="0" y="16">［단면］ 같은 배치를 옆에서 본 모습</text>

    <!-- 단면 띠 : 협력-완충-핵심-완충-협력 대칭 -->
    <g transform="translate(0,62)">
      <rect x="0"   y="0" width="96"  height="56" fill="url(#coop)" stroke="#6f8a76" stroke-width="1.6"/>
      <rect x="96"  y="0" width="76"  height="56" fill="url(#buf)"  stroke="#4f7259" stroke-width="1.8"/>
      <rect x="172" y="0" width="112" height="56" fill="url(#core)" stroke="#1b4332" stroke-width="2.2"/>
      <rect x="284" y="0" width="76"  height="56" fill="url(#buf)"  stroke="#4f7259" stroke-width="1.8"/>
      <rect x="360" y="0" width="96"  height="56" fill="url(#coop)" stroke="#6f8a76" stroke-width="1.6"/>

      <text class="sm" x="48"  y="76" text-anchor="middle">협력</text>
      <text class="sm" x="134" y="76" text-anchor="middle">완충</text>
      <text class="sm" x="228" y="76" text-anchor="middle">핵심</text>
      <text class="sm" x="322" y="76" text-anchor="middle">완충</text>
      <text class="sm" x="408" y="76" text-anchor="middle">협력</text>

      <!-- 외부 교란이 완충에서 멈춘다 : 띠 안쪽 상단에 표시 -->
      <path d="M 8,-10 L 88,-10" class="lead" stroke="#a1651a" stroke-width="2"
            marker-end="url(#a2)"/>
      <text class="sm" x="8" y="-18" fill="#a1651a">외부 교란</text>
      <line x1="96" y1="-6" x2="96" y2="60" stroke="#a1651a"
            stroke-width="2" stroke-dasharray="5 4"/>
      <text class="sm" x="102" y="-18" fill="#a1651a">완충구역에서 차단된다</text>
    </g>

    <!-- 구역별 설명 -->
    <g transform="translate(0,180)">
      <line x1="0" y1="0" x2="456" y2="0" stroke="#c3d2c7" stroke-width="1.2"/>

      <rect x="0" y="14" width="18" height="18" fill="url(#core)" stroke="#1b4332" stroke-width="1.8"/>
      <text class="zn"  x="28" y="28">핵심구역</text>
      <text class="dsc" x="112" y="28">있는 그대로 지키는 보호 구역. 장기 보전과 학술 조사만 허용</text>

      <rect x="0" y="52" width="18" height="18" fill="url(#buf)" stroke="#4f7259" stroke-width="1.8"/>
      <text class="zn"  x="28" y="66">완충구역</text>
      <text class="dsc" x="112" y="66">핵심구역을 둘러싸 외부 교란이 안으로 미치지 않게 막는다</text>

      <rect x="0" y="90" width="18" height="18" fill="url(#coop)" stroke="#6f8a76" stroke-width="1.8"/>
      <text class="zn"  x="28" y="104">협력구역</text>
      <text class="dsc" x="112" y="104">주민이 자원을 지속가능한 방식으로 이용하며 살아가는 구역</text>
    </g>
  </g>
</svg>
