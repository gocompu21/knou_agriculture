  <!-- 읽는 법 -->
  <g transform="translate(552,330)">
    <rect x="0" y="0" width="322" height="192" rx="6" fill="#f2f5f1" stroke="#4f7259" stroke-width="1.6"/>
    <text class="lgT" x="16" y="28">읽는 법</text>
    <text class="lg" x="16" y="56" style="font-size:14px"><tspan font-weight="700">밀도</tspan> = 그 종의 기호(개체) 총 개수</text>
    <text class="lg" x="16" y="80" style="font-size:14px"><tspan font-weight="700">빈도</tspan> = 그 종이 나타난 소방형구 수</text>
