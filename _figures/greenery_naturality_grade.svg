<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440"
     font-family="'Malgun Gothic','맑은 고딕',sans-serif">
  <title>녹지자연도 1~10등급과 0등급(수공간)</title>
  <desc>시가지에서 고산초원까지 자연성이 높아지는 순서를 왼쪽에서 오른쪽으로 올라가는 계단 단면으로 배열하고, 8~10등급 핵심, 4~7등급 완충, 1~3등급 전이 대응을 아래 띠로 표시한 그림. 수공간은 별도 0등급으로 분리한다.</desc>

  <defs>
    <marker id="nm" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a1651a"/>
    </marker>
    <pattern id="water" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#eef3f5"/>
      <path d="M0,4 q2,-2.4 4,0 t4,0" fill="none" stroke="#6c8b99" stroke-width="1.2"/>
    </pattern>
  </defs>

  <style>
    .h   { font-size: 19px; font-weight: 700; fill: #1b4332; }
    .gn  { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .gt  { font-size: 13.5px; text-anchor: middle; }
    .zn  { font-size: 14.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .sc  { font-size: 14px; fill: #555; }
  </style>

  <text class="h" x="20" y="28">녹지자연도 — 녹피율을 기준으로 한 자연성 등급</text>

  <!-- 자연성 축 -->
  <line x1="30" y1="52" x2="800" y2="52" stroke="#a1651a" stroke-width="2" marker-end="url(#nm)"/>
  <text x="30"  y="46" font-size="13.5" fill="#a1651a">이용·교란 많음</text>
  <text x="796" y="46" font-size="13.5" fill="#a1651a" text-anchor="end">자연성 높음</text>

  <!-- 계단: 등급이 오를수록 막대가 높고 진하다 -->
  <g>
    <!-- 1 -->
    <rect x="30" y="292" width="70" height="36" fill="#ffffff" stroke="#1b4332" stroke-width="1.5"/>
    <text class="gn" x="65" y="310" fill="#1b4332">1</text>
    <text class="gt" x="65" y="325" fill="#1b4332">시가지</text>
    <!-- 2 -->
    <rect x="106" y="274" width="70" height="54" fill="#f0f4f0" stroke="#1b4332" stroke-width="1.5"/>
    <text class="gn" x="141" y="296" fill="#1b4332">2</text>
    <text class="gt" x="141" y="316" fill="#1b4332">경작지</text>
    <!-- 3 -->
    <rect x="182" y="256" width="70" height="72" fill="#e3ebe4" stroke="#1b4332" stroke-width="1.5"/>
    <text class="gn" x="217" y="284" fill="#1b4332">3</text>
    <text class="gt" x="217" y="304" fill="#1b4332">과수원</text>
    <!-- 4 -->
    <rect x="258" y="238" width="70" height="90" fill="#d3e0d6" stroke="#1b4332" stroke-width="1.5"/>
    <text class="gn" x="293" y="272" fill="#1b4332">4</text>
    <text class="gt" x="293" y="292" fill="#1b4332">1차초원</text>
    <!-- 5 -->
    <rect x="334" y="220" width="70" height="108" fill="#c1d4c6" stroke="#1b4332" stroke-width="1.5"/>
    <text class="gn" x="369" y="256" fill="#1b4332">5</text>
    <text class="gt" x="369" y="276" fill="#1b4332">2차초원</text>
    <!-- 6 -->
    <rect x="410" y="202" width="70" height="126" fill="#a7c1ae" stroke="#1b4332" stroke-width="1.5"/>
    <text class="gn" x="445" y="240" fill="#1b4332">6</text>
    <text class="gt" x="445" y="260" fill="#1b4332">조림지</text>
    <!-- 7 -->
    <rect x="486" y="184" width="70" height="144" fill="#89ac93" stroke="#1b4332" stroke-width="1.5"/>
    <text class="gn" x="521" y="224" fill="#ffffff">7</text>
    <text class="gt" x="521" y="244" fill="#ffffff">유령림</text>
    <!-- 8 -->
    <rect x="562" y="166" width="70" height="162" fill="#6a9179" stroke="#1b4332" stroke-width="1.5"/>
    <text class="gn" x="597" y="208" fill="#ffffff">8</text>
    <text class="gt" x="597" y="228" fill="#ffffff">장령림</text>
    <!-- 9 -->
    <rect x="638" y="148" width="70" height="180" fill="#40705a" stroke="#1b4332" stroke-width="1.5"/>
    <text class="gn" x="673" y="192" fill="#ffffff">9</text>
    <text class="gt" x="673" y="212" fill="#ffffff">원시림</text>
    <!-- 10 -->
    <rect x="714" y="130" width="70" height="198" fill="#1b4332" stroke="#1b4332" stroke-width="1.5"/>
    <text class="gn" x="749" y="176" fill="#ffffff">10</text>
    <text class="gt" x="749" y="196" fill="#ffffff">고산초원</text>
  </g>
  <line x1="30" y1="328" x2="784" y2="328" stroke="#1b4332" stroke-width="2"/>

  <!-- 구역 대응 띠 -->
  <g>
    <rect x="30"  y="338" width="222" height="26" fill="#c9a06a" stroke="#a1651a" stroke-width="1.4"/>
    <text class="zn" x="141" y="356">전이 (1~3등급)</text>
    <rect x="258" y="338" width="298" height="26" fill="#8f9f7c" stroke="#a1651a" stroke-width="1.4"/>
    <text class="zn" x="407" y="356">완충 (4~7등급)</text>
    <rect x="562" y="338" width="222" height="26" fill="#3d6350" stroke="#a1651a" stroke-width="1.4"/>
    <text class="zn" x="673" y="356">핵심 (8~10등급)</text>
  </g>

  <!-- 0등급: 수공간 (등급 서열 밖) -->
  <rect x="800" y="130" width="80" height="198" rx="6"
        fill="url(#water)" stroke="#4a6d7c" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="gn" x="840" y="212" fill="#2f4a55">0등급</text>
  <text class="gt" x="840" y="234" fill="#2f4a55">수공간</text>
  <text x="840" y="356" font-size="13" fill="#4a6d7c" text-anchor="middle">별도 구분</text>

  <text class="sc" x="20" y="392">※ 녹지가 인간에 의해 얼마나 이용·교란되었는지를 나타내며, 녹피율을 분류기준으로 삼는다.</text>
  <text class="sc" x="20" y="416">※ 1~10등급은 자연성이 높아지는 순서이고, 수공간은 서열에 넣지 않고 0등급으로 따로 둔다.</text>
</svg>
