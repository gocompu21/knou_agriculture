<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한울회 - 가입 신청 접수</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)),
                linear-gradient(135deg, #1b4332 0%, #2d6a4f 50%, #40916c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 540px;
            margin: 20px;
            padding: 50px 40px;
            text-align: center;
        }

        .icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }

        h1 {
            color: #1b4332;
            font-size: 1.6rem;
            margin: 0 0 14px 0;
        }

        .lead {
            color: #4a5568;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 22px;
        }

        .email-box {
            background: #f0f9f4;
            border: 1px solid #b7e0c5;
            color: #1b4332;
            font-weight: 600;
            padding: 12px 16px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 24px;
        }

        .notice {
            background: #fff8e1;
            border-left: 4px solid #ffc107;
            color: #6b5a16;
            text-align: left;
            padding: 14px 16px;
            border-radius: 6px;
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 26px;
        }

        .notice b {
            color: #5a4710;
        }

        .actions a {
            display: inline-block;
            padding: 12px 22px;
            background: linear-gradient(to right, #2d6a4f, #1b4332);
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin: 4px;
        }

        .actions a.sub {
            background: #f1f5f9;
            color: #475569;
        }

        .resent-banner {
            background: #e3f2fd;
            color: #0d47a1;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 0.92rem;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">⏳</div>
        <h1>가입 신청이 접수되었습니다</h1>
        {% if resent %}
        <div class="resent-banner">이미 신청하신 계정이 있어 관리자에게 알림을 다시 보냈습니다.</div>
        {% endif %}
        <p class="lead">
            <b>관리자 검토 후 승인</b>되면 아래 이메일 주소로<br>
            인증 메일이 발송됩니다. 인증 후 사용하실 수 있습니다.
        </p>
        <div class="email-box">{{ email }}</div>
        <div class="notice">
            <b>승인 절차 안내</b><br>
            • 관리자 검토는 보통 <b>하루 이내</b> 처리됩니다.<br>
            • 승인되면 등록하신 이메일로 <b>인증 메일</b>이 자동 발송됩니다.<br>
            • 인증 메일이 도착하지 않으면 스팸함도 확인해 주세요.<br>
            • 7일 이내 승인되지 않으면 신청은 자동 취소됩니다.
        </div>
        <div class="actions">
            <a href="/">홈으로</a>
        </div>
    </div>
</body>

</html>
