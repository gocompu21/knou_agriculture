{% comment %}
농약 DVD 암기카드 — 스타일 조각. 쓰는 쪽 {% block extra_css %} 의 <style> 안에 넣는다.
이름은 `pc-` 로 통일했다. 실기 페이지에 이미 `.fq-`·`.tb-`·`.mk-` 가 있어
겹치지 않게 두어야 한다(잡초 탭에서 14개가 겹쳐 고생한 적이 있다).
{% endcomment %}
    .pc-wrap { max-width: 720px; margin: 0 auto; }
    .pc-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
        margin-bottom: 14px; }
    .pc-head h3 { font-size: 1.05rem; font-weight: 800; color: #1b4332; margin: 0; }
    .pc-head .sub { font-size: 0.83rem; color: #7b8a80; }

    /* 범위 버튼 — 지금 범위만 진하고 나머지는 옅다 */
    .pc-modes { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .pc-mode { border: 1px solid #cfe0d5; background: #fff; color: #3c5c4a;
        border-radius: 16px; padding: 5px 14px; font-size: 0.82rem; font-weight: 600;
        cursor: pointer; }
    .pc-mode.on { background: #1b4332; border-color: #1b4332; color: #fff; }
    .pc-modes:has(.on) .pc-mode:not(.on) { opacity: .55; }
    .pc-mode:disabled { opacity: .35; cursor: default; }

    /* 문제 — 농약 용기에 상표가 붙은 모습. 이름이 상표 자리에 들어간다.
       바탕은 약장 선반처럼 옅은 결을 준다 — 흰 바탕에 흰 병에 흰 상표면
       셋이 한 덩어리로 뭉개져 무엇이 문제인지 눈에 걸리지 않는다. */
    .pc-card { position: relative; border: 1px solid #cfe0d6; border-radius: 14px;
        padding: 22px 20px 26px; text-align: center;
        background:
            radial-gradient(120% 80% at 50% 0%, #ffffff 0%, #f4f9f6 55%, #e8f1ec 100%);
        box-shadow: inset 0 1px 0 #fff, 0 2px 10px rgba(20,49,42,.06); }
    /* 출제 횟수는 카드 오른쪽 위 모서리 — 문제(상표)를 가리지 않는 자리다 */
    .pc-freq { position: absolute; top: 12px; right: 12px; font-size: 0.75rem;
        font-weight: 700; color: #8a6d1f; background: #fdf6e0; border-radius: 10px;
        padding: 3px 10px; }
    .pc-freq[hidden] { display: none; }

    .pc-bottle { position: relative; width: 190px; margin: 0 auto; }
    .pc-bottle svg { display: block; width: 100%; height: auto;
        filter: drop-shadow(0 3px 6px rgba(20,49,42,.12)); }

    /* ── 답을 고른 뒤에만 포장 색이 드러난다 ──
       **실제 농약 포장 색 규칙**이다 — 살충제 녹색, 살균제 분홍, 제초제 황색.
       실물처럼 **병은 흰색이고 뚜껑과 상표 색면이 물든다.** 색이 입혀지는 것
       자체가 외울 거리다. 문제를 낼 때는 절대 칠하지 않는다 — 병 색으로 답이
       새면 문제가 아니다. */
    .pc-cap, .pc-lab-face, .pc-lab-catbox, .pc-lab-cat, .pc-name {
        transition: fill .35s ease, color .35s ease; }

    .pc-bottle.ans-살충제 .pc-cap { fill: #2e7d32; }
    .pc-bottle.ans-살충제 .pc-lab-face { fill: #3f9d43; }
    .pc-bottle.ans-살충제 .pc-lab-catbox { fill: #1b5e20; }
    .pc-bottle.ans-살충제 .pc-lab-cat { fill: #fff; }
    .pc-bottle.ans-살충제 .pc-name { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.25); }

    .pc-bottle.ans-살균제 .pc-cap { fill: #c62828; }
    .pc-bottle.ans-살균제 .pc-lab-face { fill: #e8477a; }
    .pc-bottle.ans-살균제 .pc-lab-catbox { fill: #a81b52; }
    .pc-bottle.ans-살균제 .pc-lab-cat { fill: #fff; }
    .pc-bottle.ans-살균제 .pc-name { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.25); }

    /* 황색 위에서는 흰 글자가 묻힌다 — 글자를 검게 둔다 */
    .pc-bottle.ans-제초제 .pc-cap { fill: #f5c400; }
    .pc-bottle.ans-제초제 .pc-lab-face { fill: #fbd02b; }
    .pc-bottle.ans-제초제 .pc-lab-catbox { fill: #6b5300; }
    .pc-bottle.ans-제초제 .pc-lab-cat { fill: #fff; }
    .pc-bottle.ans-제초제 .pc-name { color: #241c00; }

    /* 상표 글자 자리 — 가운데 색면(41,110 ~ 159,214)에 **비율로** 얹는다.
       픽셀로 두면 폭이 줄어드는 화면에서 어긋난다(viewBox 200×282). */
    .pc-label { position: absolute; left: 20.5%; top: 39%; width: 59%; height: 36.9%;
        display: flex; align-items: center; justify-content: center; padding: 0 5px; }
    .pc-name { font-size: 1.15rem; font-weight: 800; color: #14312a;
        letter-spacing: -.03em; line-height: 1.25; word-break: keep-all; }
    /* 이름이 길면 상표를 넘치므로 글자를 줄인다(JS 가 길이를 보고 붙인다).
       긴 것은 **줄바꿈도 풀어 준다** — 농약명은 한 낱말이라 keep-all 로 두면
       끊을 곳이 없어 가로로 삐져나간다(글루포시네이트암모늄 …). 고유명사라
       아무 데서 끊겨도 읽히고, 실제 농약 상표도 그렇게 앉힌다. */
    .pc-name.len6 { font-size: 1.02rem; }
    .pc-name.len8 { font-size: 0.9rem; overflow-wrap: anywhere; word-break: normal; }
    .pc-name.len10 { font-size: 0.8rem; letter-spacing: -.04em;
        overflow-wrap: anywhere; word-break: normal; }

    /* 보기 셋 — 자리가 늘 같아야 눈이 기억한다 */
    .pc-choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
        margin-top: 18px; }
    .pc-ch { border: 2px solid #cfe0d5; background: #fff; border-radius: 10px;
        padding: 13px 6px; font-size: 0.95rem; font-weight: 700; color: #2f4a3c;
        cursor: pointer; transition: background .12s, border-color .12s; }
    .pc-ch:hover:not(:disabled) { background: #f2f8f4; }
    .pc-ch:disabled { cursor: default; }
    .pc-ch.right { background: #1b5e20; border-color: #1b5e20; color: #fff; }
    .pc-ch.wrong { background: #c62828; border-color: #c62828; color: #fff; }
    .pc-ch.dim { opacity: .45; }

    /* 답 풀이 */
    .pc-ans { margin-top: 16px; text-align: left; border-top: 1px dashed #dfe8e3;
        padding-top: 14px; }
    .pc-ans[hidden] { display: none; }
    .pc-verdict { font-weight: 800; font-size: 0.98rem; margin-bottom: 8px; }
    .pc-verdict.o { color: #1b5e20; }
    .pc-verdict.x { color: #c62828; }
    .pc-hint { font-size: 0.9rem; color: #333; line-height: 1.7; }
    /* 단서는 **빨간 글자**다 — 원본 PPT 가 답 슬라이드에서 그렇게 칠했고,
       그 색으로 외운 사람이 화면에서도 같은 색을 찾는다 */
    .pc-hint b, .pc-table b { color: #d32f2f; font-weight: 800; }
    /* 포장 색 규칙 한 줄 — 답 풀이 끝에 붙는다 */
    .pc-pack { margin-top: 7px; font-size: 0.8rem; color: #7b8a80; }
    .pc-pack i { font-style: normal; font-weight: 700; border-radius: 4px;
        padding: 1px 5px; }
    .pc-pack .c1 { background: #e7f4e9; color: #2e7d32; }
    .pc-pack .c2 { background: #fdeaea; color: #c62828; }
    .pc-pack .c3 { background: #fdf7e0; color: #8a6d1f; }
    .pc-whole { font-size: 0.88rem; color: #8a6d1f; background: #fdf6e0;
        border-radius: 8px; padding: 8px 11px; line-height: 1.6; }
    .pc-note { margin-top: 9px; font-size: 0.86rem; color: #55635b; line-height: 1.65;
        background: #f6faf7; border-left: 3px solid #2d6a4f; border-radius: 0 8px 8px 0;
        padding: 8px 11px; }

    .pc-actions { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
    .pc-actions[hidden] { display: none; }   /* flex 는 [hidden] 을 이긴다 */
    .pc-next { background: #1b4332; color: #fff; border: 0; border-radius: 18px;
        padding: 10px 28px; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
    .pc-sub { background: #eef2f0; color: #55635b; border: 0; border-radius: 18px;
        padding: 10px 18px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }

    .pc-stat { margin-top: 14px; text-align: center; font-size: 0.82rem; color: #8a988f; }
    .pc-stat b { color: #1b4332; }
    .pc-done { text-align: center; padding: 30px 16px; color: #55635b;
        font-size: 0.92rem; line-height: 1.8; }

    /* 단서 규칙표 — 카드 92종을 세어 만든다(pesticide.hint_rules) */
    .pc-rules { margin-bottom: 12px; border: 1px solid #e4ece7; border-radius: 10px;
        background: #fafcfb; }
    .pc-rules summary { cursor: pointer; padding: 9px 13px; font-size: 0.86rem;
        font-weight: 700; color: #1b4332; }
    .pc-rulebox { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 13px 13px; }
    .pc-rule { display: inline-flex; align-items: center; gap: 5px;
        border-radius: 9px; padding: 4px 9px; font-size: 0.8rem; }
    .pc-rule b { font-weight: 800; }
    .pc-rule .n { font-size: 0.74rem; opacity: .7; }
    .pc-rule.살충제 { background: #d8ecdc; color: #1b5e20; }
    .pc-rule.살균제 { background: #f7dcef; color: #8e2f6d; }
    .pc-rule.제초제 { background: #fbf0c0; color: #7a6110; }
    /* 계열이 갈리는 단서 — 쓸 수 없다는 사실이 더 중요하다 */
    .pc-rule.mixed { background: #fdeaea; color: #b23b3b;
        border: 1px dashed #e7a3a3; }

    /* 목록 */
    .pc-list { margin-top: 18px; }
    .pc-list[hidden] { display: none; }
    .pc-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    .pc-table th { background: #1b4332; color: #fff; padding: 7px 8px;
        position: sticky; top: 0; font-weight: 700; }
    .pc-table td { border-bottom: 1px solid #eef2f0; padding: 6px 8px; }
    .pc-table tr:hover td { background: #fafcfb; }
    .pc-cat { display: inline-block; border-radius: 8px; padding: 1px 8px;
        font-size: 0.76rem; font-weight: 700; white-space: nowrap; }
    .pc-cat.살충제 { background: #d8ecdc; color: #1b5e20; }
    .pc-cat.살균제 { background: #f7dcef; color: #8e2f6d; }
    .pc-cat.제초제 { background: #fbf0c0; color: #7a6110; }
    .pc-scroll { max-height: 60vh; overflow-y: auto; border: 1px solid #e4ece7;
        border-radius: 10px; }

    @media (max-width: 480px) {
        .pc-card { padding: 20px 14px; }
        .pc-name { font-size: 1.4rem; }
        .pc-ch { font-size: 0.88rem; padding: 12px 4px; }
    }
