{% comment %}
농약 DVD 암기카드 — 스크립트 조각. 쓰는 쪽 {% block extra_js %} 의 <script> 안에 넣는다.
이름은 `_pc` 로 시작해 같은 페이지의 다른 조각과 겹치지 않게 한다.
{% endcomment %}
(function () {
    var quiz = document.getElementById('pcQuiz');
    if (!quiz) return;                       // 이 탭이 없는 자격증

    var CSRF = (document.querySelector('[name=csrfmiddlewaretoken]') || {}).value || '';
    var CHOICES = ['살충제', '살균제', '제초제'];
    var _pc = { mode: 'all', seen: [], card: null, busy: false, started: false };

    var elName = document.getElementById('pcName'),
        elFreq = document.getElementById('pcFreq'),
        elCh = document.getElementById('pcChoices'),
        elAns = document.getElementById('pcAns'),
        elVerdict = document.getElementById('pcVerdict'),
        elWhy = document.getElementById('pcWhy'),
        elNote = document.getElementById('pcNote'),
        elActions = document.getElementById('pcActions'),
        elStat = document.getElementById('pcStat');

    function esc(s) {
        var d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
    }

    /* 농약명 안에서 단서가 되는 조각만 빨갛게 쓴다(원본 PPT 와 같은 색).
       어미일 때도 어두일 때도 있어 위치를 찾아 넣는다. */
    function markHint(name, hint, cls) {
        if (!hint) return esc(name);
        var i = name.indexOf(hint);
        if (i < 0) return esc(name);
        return esc(name.slice(0, i)) +
               '<b' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(hint) + '</b>' +
               esc(name.slice(i + hint.length));
    }

    /* 출제 횟수를 별로. 92종이 1~8회에 몰려 있어 잡초(50/20/5)와 기준이 다르다 —
       6회↑ 6종 · 4~5회 37종 · 2~3회 32종 · 1회 17종으로 갈린다. */
    function stars(n) {
        if (n >= 6) return '★★★';
        if (n >= 4) return '★★';
        if (n >= 2) return '★';
        return n >= 1 ? '☆' : '';
    }

    /* 받침이 있으면 '이', 없으면 '가'. 단서가 '포스'·'메틸'·'실' 처럼 제각각이라
       조사를 하나로 박아 두면 "메틸 가" 같은 말이 된다. */
    function josa(word, with_, without) {
        var c = word.charCodeAt(word.length - 1);
        if (c < 0xAC00 || c > 0xD7A3) return without;      // 한글이 아니면 그대로
        return ((c - 0xAC00) % 28) ? with_ : without;
    }

    /* 상표 자리는 좁다 — 이름이 길면 글자를 줄인다.
       `hint` 를 주면 **상표 위에서도 단서를 빨갛게** 쓴다(답을 안 뒤에만). */
    function setName(name, hint) {
        var n = name.length;
        elName.className = 'pc-name' + (n >= 10 ? ' len10' : n >= 8 ? ' len8'
                                        : n >= 6 ? ' len6' : '');
        if (hint) elName.innerHTML = markHint(name, hint);
        else elName.textContent = name;
    }

    function drawChoices(enabled) {
        elCh.innerHTML = '';
        CHOICES.forEach(function (c) {
            var b = document.createElement('button');
            b.type = 'button'; b.className = 'pc-ch'; b.textContent = c;
            b.disabled = !enabled;
            b.addEventListener('click', function () { pick(c, b); });
            elCh.appendChild(b);
        });
    }

    function showStat(s) {
        if (!s) return;
        elStat.innerHTML = '푼 것 <b>' + s.solved + '</b> / ' + s.total +
                           ' · 오답 <b>' + s.wrong + '</b>';
        var w = document.getElementById('pcWrongBtn');
        if (w) {
            w.textContent = '오답만' + (s.wrong ? ' (' + s.wrong + ')' : '');
            w.disabled = s.wrong === 0 && _pc.mode !== 'wrong';
        }
    }

    function next() {
        if (_pc.busy) return;
        _pc.busy = true;
        elAns.hidden = true; elNote.hidden = true; elActions.hidden = true;
        setName('…'); elFreq.hidden = true; elCh.innerHTML = '';
        fetch('/gisa/pesticide/next/?mode=' + _pc.mode + '&seen=' + _pc.seen.join(','))
            .then(function (r) {
                if (!r.ok) throw new Error('문제를 불러오지 못했습니다 (' + r.status + ')');
                return r.json();
            })
            .then(function (d) {
                _pc.busy = false;
                if (d.done) {
                    elFreq.hidden = true;
                    quiz.querySelector('.pc-card').innerHTML =
                        '<div class="pc-done">' +
                        (d.total ? '이 범위 <b>' + d.total + '종</b>을 모두 풀었습니다.<br>' +
                                   '범위를 바꾸거나 아래에서 기록을 지우고 다시 도세요.'
                                 : '이 범위에 낼 문제가 없습니다.') + '</div>';
                    elActions.hidden = false;
                    document.getElementById('pcNext').textContent = '처음부터 다시';
                    _pc.seen = [];
                    return;
                }
                _pc.card = d;
                setName(d.name);
                if (d.exam_count) {
                    elFreq.textContent = '기출 ' + d.exam_count + '회';
                    elFreq.hidden = false;
                }
                drawChoices(true);
            })
            .catch(function (e) {
                _pc.busy = false;
                elName.textContent = e.message;
            });
    }

    function pick(choice, btn) {
        if (!_pc.card || _pc.busy) return;
        _pc.busy = true;
        var fd = new FormData();
        fd.append('card', _pc.card.card);
        fd.append('selected', choice);
        fetch('/gisa/pesticide/answer/', {
            method: 'POST', headers: { 'X-CSRFToken': CSRF }, body: fd
        })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                _pc.busy = false;
                if (!d.ok) throw new Error(d.error || '채점 실패');
                _pc.seen.push(_pc.card.card);

                Array.prototype.forEach.call(elCh.children, function (b) {
                    b.disabled = true;
                    if (b.textContent === d.answer) b.classList.add('right');
                    else if (b === btn) b.classList.add('wrong');
                    else b.classList.add('dim');
                });

                elVerdict.textContent = d.correct ? '정답입니다' : '틀렸습니다 — ' + d.answer;
                elVerdict.className = 'pc-verdict ' + (d.correct ? 'o' : 'x');

                /* 포장 색은 답을 안 뒤에 드러난다 — 실제 농약 포장 규칙이라
                   색이 입혀지는 것 자체가 외울 거리다 */
                var bt = quiz.querySelector('.pc-bottle');
                if (bt) bt.className = 'pc-bottle ans-' + d.answer;
                /* 상표 왼쪽 위 칸은 실물에서 계열명이 찍히는 자리다.
                   답을 알기 전에는 「농 약」 으로 두었다가 여기서 채운다 */
                var cat = document.getElementById('pcLabCat');
                if (cat) cat.textContent = d.answer;
                if (!d.whole) setName(d.name, d.hint);   // 상표에도 단서를 빨갛게
                /* 이름 줄 — 단서는 이미 빨갛게 보이므로 "…가 살균제를 가리킵니다"
                   같은 말을 덧붙이지 않는다. 별과 영문명만 곁들인다. */
                var head = '<div class="pc-title">' +
                    (d.whole ? esc(d.name) : markHint(d.name, d.hint)) +
                    ' <span class="pc-st">' + stars(d.exam_count) + '</span>';
                if (d.en_name) head += '<span class="pc-en">(' + esc(d.en_name) + ')</span>';
                head += '</div>';

                /* 단서로 가릴 수 없는 두 경우만 한 줄로 알린다 */
                var warn = '';
                if (d.whole) {
                    warn = '<div class="pc-whole">이름만으로는 가릴 수 없습니다 — 통암기</div>';
                } else if (d.hint_mixed) {
                    warn = '<div class="pc-whole"><b>' + esc(d.hint) + '</b>' +
                        josa(d.hint, '은', '는') + ' 계열을 가리지 못합니다</div>';
                }

                var meta = '';
                if (d.family) meta += '<span class="pc-b1">' + esc(d.family) + '</span>';
                meta += '<span class="pc-b2">' + esc(d.answer) + '</span>';
                var rows = '';
                if (d.action) rows += '<div class="pc-row"><b>작용기작</b><span>' +
                    esc(d.action) + '</span></div>';
                if (d.target) rows += '<div class="pc-row"><b>주요대상</b><span>' +
                    esc(d.target) + '</span></div>';
                elWhy.innerHTML = head + warn +
                    '<div class="pc-meta">' + meta + '</div>' + rows;

                if (d.note) { elNote.textContent = d.note; elNote.hidden = false; }
                elAns.hidden = false;
                elActions.hidden = false;
                document.getElementById('pcNext').textContent = '다음 문제';
                showStat(d.stats);
            })
            .catch(function (e) {
                _pc.busy = false;
                elVerdict.textContent = e.message;
                elVerdict.className = 'pc-verdict x';
                elAns.hidden = false;
            });
    }

    /* 카드 속을 통째로 갈아 끼우는 자리가 둘(문제 다 풀었을 때, 다음 문제)이라
       **처음 마크업을 복제해 둔다.** 병 SVG 를 자바스크립트에 다시 적으면
       템플릿과 두 벌이 되어 한쪽만 고치는 일이 생긴다. */
    var CARD_HTML = quiz.querySelector('.pc-card').innerHTML;

    function rebuild() {
        quiz.querySelector('.pc-card').innerHTML = CARD_HTML;
        elName = document.getElementById('pcName');
        elFreq = document.getElementById('pcFreq'); elCh = document.getElementById('pcChoices');
        elAns = document.getElementById('pcAns'); elVerdict = document.getElementById('pcVerdict');
        elWhy = document.getElementById('pcWhy'); elNote = document.getElementById('pcNote');
    }

    document.getElementById('pcNext').addEventListener('click', function () {
        rebuild();
        next();
    });

    document.querySelectorAll('.pc-mode').forEach(function (b) {
        b.addEventListener('click', function () {
            document.querySelectorAll('.pc-mode').forEach(function (x) {
                x.classList.toggle('on', x === b);
            });
            _pc.mode = b.dataset.mode;
            _pc.seen = [];                 // 범위를 바꾸면 처음부터
            document.getElementById('pcList').hidden = true;
            quiz.hidden = false;
            document.getElementById('pcNext').click();
        });
    });

    /* 목록 */
    /* 목록은 머리글을 눌러 정렬한다. 같은 칸을 다시 누르면 차례가 뒤집힌다. */
    var _pcRows = [], _pcSort = { key: 'no', asc: true };

    function pcDraw() {
        var k = _pcSort.key, sign = _pcSort.asc ? 1 : -1;
        var rows = _pcRows.slice().sort(function (a, b) {
            var x = a[k], y = b[k];
            if (k === 'name' || k === 'category' || k === 'family' || k === 'hint') {
                return sign * String(x || '').localeCompare(String(y || ''), 'ko');
            }
            return sign * ((x || 0) - (y || 0));
        });
        var h = '';
        rows.forEach(function (c) {
            h += '<tr><td>' + c.no + '</td>' +
                 '<td>' + esc(c.name) +
                 ' <span class="pc-st">' + stars(c.exam_count) + '</span></td>' +
                 '<td><span class="pc-cat ' + c.category + '">' + c.category + '</span></td>' +
                 '<td>' + (c.whole ? '<span class="pc-wh">통암기</span>'
                                   : markHint(c.name, c.hint, 'h-' + c.category)) + '</td>' +
                 '<td class="pc-fam">' + esc(c.family || '') + '</td></tr>';
        });
        document.getElementById('pcRows').innerHTML = h;
        document.querySelectorAll('.pc-table th[data-k]').forEach(function (th) {
            th.classList.toggle('up', th.dataset.k === k && _pcSort.asc);
            th.classList.toggle('down', th.dataset.k === k && !_pcSort.asc);
        });
    }

    document.querySelectorAll('.pc-table th[data-k]').forEach(function (th) {
        th.addEventListener('click', function () {
            var k = th.dataset.k;
            // 같은 칸을 다시 누르면 뒤집고, 다른 칸이면 오름차순부터
            _pcSort = { key: k, asc: _pcSort.key === k ? !_pcSort.asc : true };
            pcDraw();
        });
    });

    document.getElementById('pcListBtn').addEventListener('click', function () {
        var list = document.getElementById('pcList');
        if (!list.dataset.loaded) {
            fetch('/gisa/pesticide/list/').then(function (r) { return r.json(); })
                .then(function (d) {
                    _pcRows = d.cards;
                    pcDraw();

                    /* 단서 규칙표 — 서버가 카드를 세어 만든 것을 그린다 */
                    var rb = '';
                    (d.rules || []).forEach(function (r) {
                        rb += '<span class="pc-rule ' + (r.mixed ? 'mixed' : r.category) +
                              '" title="' + esc(r.names.join(' · ')) + '"><b>' +
                              esc(r.hint) + '</b>' +
                              (r.mixed ? ' 갈림' : ' ' + r.category) +
                              '<span class="n">' + r.count + '</span></span>';
                    });
                    document.getElementById('pcRuleBox').innerHTML = rb;

                    list.dataset.loaded = '1';
                    showStat(d.stats);
                });
        }
        list.hidden = false; quiz.hidden = true;
    });
    document.getElementById('pcListClose').addEventListener('click', function () {
        document.getElementById('pcList').hidden = true;
        quiz.hidden = false;
    });
    document.getElementById('pcReset').addEventListener('click', function () {
        if (!confirm('농약 카드 풀이 기록을 모두 지울까요?')) return;
        fetch('/gisa/pesticide/reset/', {
            method: 'POST', headers: { 'X-CSRFToken': CSRF }
        }).then(function (r) { return r.json(); })
          .then(function (d) {
              showStat(d.stats);
              _pc.seen = [];
              document.getElementById('pcList').hidden = true;
              quiz.hidden = false;
              document.getElementById('pcNext').click();
          });
    });

    /* 탭에 들어오면 첫 문제를 바로 낸다 — 잡초 탭과 같은 흐름이다.
       풀던 중이거나 목록을 보는 중이면 건드리지 않는다. */
    function autoStart() {
        if (_pc.started) return;
        var box = document.getElementById('tab-pesticide');
        if (!box || !box.classList.contains('active')) return;
        _pc.started = true;
        next();
    }
    autoStart();
    document.querySelectorAll('.tab-btn').forEach(function (b) {
        b.addEventListener('click', function () { setTimeout(autoStart, 0); });
    });
})();
