{% extends "base.html" %}

{% block title %}{{ material.title }} - {{ subject.name }}{% endblock %}

{% block extra_css %}
<style>
    .pdf-page {
        width: 100%; max-width: 1100px; margin: 0 auto;
        padding: 0 12px;
    }
    .pdf-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 14px 0; border-bottom: 1px solid #e5e9e6; margin-bottom: 14px;
        flex-wrap: wrap; gap: 10px;
    }
    .pdf-title {
        font-size: 1.05rem; color: var(--forest); font-weight: 700;
    }
    .pdf-title .subj {
        font-size: 0.82rem; color: #777; font-weight: 500; margin-right: 6px;
    }
    .pdf-actions {
        display: flex; gap: 6px; align-items: center;
    }
    .pdf-actions a, .pdf-actions button {
        text-decoration: none; padding: 7px 14px; border-radius: 7px;
        background: #e8f5df; color: var(--forest); font-size: 0.84rem;
        font-weight: 700; border: none; cursor: pointer; font-family: inherit;
    }
    .pdf-actions a:hover, .pdf-actions button:hover { background: #d4ebc8; }

    .pdf-notice {
        background: #fff8e1; border-left: 3px solid #f5b042;
        padding: 8px 14px; font-size: 0.82rem; color: #6b4d12;
        margin-bottom: 12px; border-radius: 4px;
    }

    .pdf-toolbar {
        display: flex; justify-content: center; align-items: center;
        gap: 10px; padding: 8px;
        background: #1b4332; color: #fff;
        border-radius: 8px 8px 0 0;
        font-size: 0.85rem;
    }
    .pdf-toolbar button {
        background: rgba(255,255,255,0.15); color: #fff;
        border: none; padding: 5px 10px; border-radius: 5px;
        cursor: pointer; font-size: 0.85rem; font-family: inherit;
        transition: background 0.15s;
    }
    .pdf-toolbar button:hover { background: rgba(255,255,255,0.25); }
    .pdf-toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
    .pdf-toolbar input[type=number] {
        width: 50px; padding: 4px 6px; border: none; border-radius: 4px;
        font-size: 0.85rem; text-align: center;
    }
    .pdf-toolbar .page-info { color: #d8eadc; }

    .pdf-canvas-wrap {
        background: #4a4a4a;
        border-radius: 0 0 8px 8px;
        padding: 16px;
        max-height: 78vh;
        overflow-y: auto;
        text-align: center;
        position: relative;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    }
    .pdf-canvas-wrap canvas {
        background: #fff;
        box-shadow: 0 4px 14px rgba(0,0,0,0.3);
        margin-bottom: 14px;
        max-width: 100%;
        height: auto;
        display: block;
        margin-left: auto;
        margin-right: auto;
        pointer-events: none;
    }
    .pdf-loading {
        color: #fff; padding: 40px; text-align: center;
        font-size: 0.95rem;
    }
    .pdf-error {
        color: #ffb4b4; padding: 40px; text-align: center;
        font-size: 0.95rem;
    }

    /* 워터마크 (사용자명) */
    .pdf-canvas-wrap::before {
        content: attr(data-watermark);
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%) rotate(-30deg);
        font-size: 3rem;
        color: rgba(0, 0, 0, 0.05);
        font-weight: 900;
        pointer-events: none;
        white-space: nowrap;
        z-index: 1;
    }

    @media (max-width: 768px) {
        .pdf-canvas-wrap { padding: 8px; max-height: 70vh; }
        .pdf-title { font-size: 0.95rem; }
        .pdf-toolbar { flex-wrap: wrap; gap: 6px; padding: 6px; }
        .pdf-toolbar button { padding: 4px 8px; font-size: 0.78rem; }
    }
</style>
{% endblock %}

{% block content %}
<div class="pdf-page" id="pdfPage">
    <div class="pdf-header">
        <div class="pdf-title">
            <span class="subj">[{{ subject.name }}]</span>{{ material.title }}
        </div>
        <div class="pdf-actions">
            <a href="{% url 'main:subject_detail' subject.pk %}?tab=study">← 과목으로</a>
        </div>
    </div>

    <div class="pdf-notice">
        ⚠️ 본 자료는 학습 목적의 열람·인쇄만 가능합니다. 다운로드·복제는 제한되어 있습니다.
    </div>

    <div class="pdf-toolbar">
        <button type="button" id="prevPage" title="이전">◀</button>
        <span class="page-info">
            <input type="number" id="pageNum" min="1" value="1" />
            / <span id="pageCount">-</span>
        </span>
        <button type="button" id="nextPage" title="다음">▶</button>
        <span style="margin: 0 8px; opacity: 0.5;">|</span>
        <button type="button" id="zoomOut" title="축소">－</button>
        <span id="zoomLevel">100%</span>
        <button type="button" id="zoomIn" title="확대">＋</button>
        <button type="button" id="zoomFit" title="너비맞춤">↔</button>
        <span style="margin: 0 8px; opacity: 0.5;">|</span>
        <button type="button" id="printBtn" title="인쇄">🖨 인쇄</button>
    </div>

    <div class="pdf-canvas-wrap" id="canvasWrap" data-watermark="방송대 농학과 스터디 한울회">
        <div class="pdf-loading" id="pdfLoading">📄 PDF 로딩 중...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs" type="module"></script>
<script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs';

    const PDF_URL = '{% url "main:material_stream" subject.pk material.pk %}';
    const wrap = document.getElementById('canvasWrap');
    const loading = document.getElementById('pdfLoading');
    const pageNumInput = document.getElementById('pageNum');
    const pageCountSpan = document.getElementById('pageCount');
    const zoomLevelSpan = document.getElementById('zoomLevel');

    let pdfDoc = null;
    let currentPage = 1;
    let scale = 1.3;
    let rendering = false;
    let pendingPage = null;

    async function renderPage(num) {
        if (!pdfDoc) return;
        if (rendering) { pendingPage = num; return; }
        rendering = true;

        const page = await pdfDoc.getPage(num);
        const viewport = page.getViewport({ scale });
        const wrapWidth = wrap.clientWidth - 32;
        let renderScale = scale;
        if (viewport.width > wrapWidth) {
            renderScale = scale * (wrapWidth / viewport.width);
        }
        const finalViewport = page.getViewport({ scale: renderScale });

        // 기존 canvas 제거
        wrap.querySelectorAll('canvas').forEach(c => c.remove());
        if (loading) loading.style.display = 'none';

        const canvas = document.createElement('canvas');
        canvas.width = finalViewport.width;
        canvas.height = finalViewport.height;
        wrap.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: finalViewport }).promise;

        currentPage = num;
        pageNumInput.value = num;
        zoomLevelSpan.textContent = Math.round(scale * 100) + '%';

        rendering = false;
        if (pendingPage !== null) {
            const next = pendingPage; pendingPage = null;
            renderPage(next);
        }
    }

    document.getElementById('prevPage').addEventListener('click', () => {
        if (currentPage > 1) renderPage(currentPage - 1);
    });
    document.getElementById('nextPage').addEventListener('click', () => {
        if (pdfDoc && currentPage < pdfDoc.numPages) renderPage(currentPage + 1);
    });
    pageNumInput.addEventListener('change', () => {
        const n = parseInt(pageNumInput.value, 10);
        if (pdfDoc && n >= 1 && n <= pdfDoc.numPages) renderPage(n);
        else pageNumInput.value = currentPage;
    });
    document.getElementById('zoomIn').addEventListener('click', () => {
        scale = Math.min(scale + 0.2, 3.0);
        renderPage(currentPage);
    });
    document.getElementById('zoomOut').addEventListener('click', () => {
        scale = Math.max(scale - 0.2, 0.5);
        renderPage(currentPage);
    });
    document.getElementById('zoomFit').addEventListener('click', () => {
        scale = 1.3;
        renderPage(currentPage);
    });

    // 인쇄: 모든 페이지를 캔버스로 렌더링 후 새 창에 띄워 print 호출
    document.getElementById('printBtn').addEventListener('click', async () => {
        if (!pdfDoc) return;
        const btn = document.getElementById('printBtn');
        btn.disabled = true;
        const orig = btn.textContent;
        btn.textContent = '⏳ 준비 중...';

        try {
            const printWin = window.open('', '_blank', 'width=900,height=1100');
            if (!printWin) {
                alert('팝업이 차단되어 있습니다. 팝업 허용 후 다시 시도하세요.');
                return;
            }
            printWin.document.write(`
                <!DOCTYPE html>
                <html><head><meta charset="utf-8"><title>{{ material.title }}</title>
                <style>
                    @page { margin: 10mm; }
                    body { margin: 0; padding: 0; }
                    img { display: block; width: 100%; page-break-after: always; }
                    img:last-child { page-break-after: auto; }
                </style></head><body><div id="container">
                <p style="text-align:center; color:#888; font-family:sans-serif;">인쇄 준비 중... (전체 페이지 렌더링)</p>
                </div></body></html>
            `);
            printWin.document.close();
            const container = printWin.document.getElementById('container');

            for (let i = 1; i <= pdfDoc.numPages; i++) {
                btn.textContent = `⏳ 렌더링 ${i}/${pdfDoc.numPages}`;
                const page = await pdfDoc.getPage(i);
                const viewport = page.getViewport({ scale: 2.0 });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                if (i === 1) container.innerHTML = '';
                const img = printWin.document.createElement('img');
                img.src = canvas.toDataURL('image/jpeg', 0.85);
                container.appendChild(img);
            }

            // 모든 이미지 로드 완료 후 인쇄
            const imgs = container.querySelectorAll('img');
            const waits = Array.from(imgs).map(img =>
                img.complete ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = r; })
            );
            await Promise.all(waits);
            printWin.focus();
            printWin.print();
        } catch (err) {
            console.error('인쇄 준비 실패:', err);
            alert('인쇄 준비에 실패했습니다.');
        } finally {
            btn.disabled = false;
            btn.textContent = orig;
        }
    });

    // 키보드 네비게이션
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            e.preventDefault();
            if (currentPage > 1) renderPage(currentPage - 1);
        } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
            e.preventDefault();
            if (pdfDoc && currentPage < pdfDoc.numPages) renderPage(currentPage + 1);
        }
    });

    // PDF 로드
    try {
        const loadingTask = pdfjsLib.getDocument({
            url: PDF_URL,
            withCredentials: true,
        });
        pdfDoc = await loadingTask.promise;
        pageCountSpan.textContent = pdfDoc.numPages;
        pageNumInput.max = pdfDoc.numPages;
        await renderPage(1);
    } catch (err) {
        console.error('PDF 로드 실패:', err);
        wrap.innerHTML = '<div class="pdf-error">PDF를 불러올 수 없습니다.<br><small>' + (err.message || '') + '</small></div>';
    }
</script>

<script>
(function() {
    // 우클릭 차단 (페이지 전체)
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    });
    // 다운로드/저장/소스보기/개발자도구 단축키 차단 (인쇄 Ctrl+P 는 허용)
    document.addEventListener('keydown', function(e) {
        var key = (e.key || '').toLowerCase();
        if ((e.ctrlKey || e.metaKey) && (key === 's' || key === 'u' || key === 'a' || key === 'c')) {
            // 입력 필드 안에서는 허용
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            e.preventDefault();
            return false;
        }
        if (key === 'f12' || (e.ctrlKey && e.shiftKey && (key === 'i' || key === 'j' || key === 'c'))) {
            e.preventDefault();
        }
    });
    // 드래그 차단
    document.addEventListener('dragstart', function(e) {
        e.preventDefault();
    });
})();
</script>
{% endblock %}
