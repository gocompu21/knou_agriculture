{% extends "base.html" %}

{% block title %}{{ material.title }} - {{ subject.name }}{% endblock %}

{% block extra_css %}
<style>
    .pdf-page {
        width: 100%; max-width: 1200px; margin: 0 auto;
        padding: 0 12px;
    }
    .pdf-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 14px 0; border-bottom: 1px solid #e5e9e6; margin-bottom: 14px;
        flex-wrap: wrap; gap: 10px;
    }
    .pdf-title {
        font-size: 1.05rem; color: var(--forest); font-weight: 700;
    }
    .pdf-title .subj {
        font-size: 0.82rem; color: #777; font-weight: 500; margin-right: 6px;
    }
    .pdf-actions a {
        text-decoration: none; padding: 7px 14px; border-radius: 7px;
        background: #e8f5df; color: var(--forest); font-size: 0.84rem;
        font-weight: 700;
    }
    .pdf-actions a:hover { background: #d4ebc8; }

    .pdf-notice {
        background: #fff8e1; border-left: 3px solid #f5b042;
        padding: 8px 14px; font-size: 0.82rem; color: #6b4d12;
        margin-bottom: 12px; border-radius: 4px;
    }

    .pdf-frame-wrap {
        position: relative;
        background: #4a4a4a;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    }
    .pdf-frame {
        width: 100%;
        height: 80vh;
        border: none;
        display: block;
    }
    /* iframe 위 투명 가드 (우클릭 차단용 - 동일 출처일 때만 작동) */
    .pdf-guard {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none;
    }

    @media (max-width: 768px) {
        .pdf-frame { height: 75vh; }
        .pdf-title { font-size: 0.95rem; }
    }
</style>
{% endblock %}

{% block content %}
<div class="pdf-page" id="pdfPage">
    <div class="pdf-header">
        <div class="pdf-title">
            <span class="subj">[{{ subject.name }}]</span>{{ material.title }}
        </div>
        <div class="pdf-actions">
            <a href="{% url 'main:subject_detail' subject.pk %}?tab=study">← 과목으로</a>
        </div>
    </div>

    <div class="pdf-notice">
        ⚠️ 본 자료는 학습 목적의 열람만 가능합니다. 다운로드·인쇄·복제는 제한되어 있습니다.
    </div>

    <div class="pdf-frame-wrap" id="pdfWrap">
        <iframe class="pdf-frame"
                src="{% url 'main:material_stream' subject.pk material.pk %}#toolbar=0&navpanes=0&scrollbar=1"
                title="{{ material.title }}"></iframe>
        <div class="pdf-guard"></div>
    </div>
</div>

<script>
(function() {
    // 우클릭 차단
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    });
    // 다운로드/저장/인쇄 단축키 차단
    document.addEventListener('keydown', function(e) {
        var key = (e.key || '').toLowerCase();
        if ((e.ctrlKey || e.metaKey) && (key === 's' || key === 'p' || key === 'u')) {
            e.preventDefault();
            return false;
        }
        // PrintScreen, F12 (개발자도구) — 시도만 차단 (완전 방지 불가)
        if (key === 'printscreen' || key === 'f12') {
            e.preventDefault();
        }
    });
    // 텍스트 드래그 선택 차단 (헤더 외 영역)
    var page = document.getElementById('pdfPage');
    if (page) {
        page.addEventListener('selectstart', function(e) {
            if (e.target.closest('.pdf-frame-wrap')) {
                e.preventDefault();
                return false;
            }
        });
    }
})();
</script>
{% endblock %}
