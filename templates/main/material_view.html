{% extends "base.html" %}

{% block title %}{{ material.title }} - {{ subject.name }}{% endblock %}

{% block extra_css %}
<style>
    /* 자료를 보는 화면이라 세로를 최대한 쓴다. base.html 의 main 여백
       (위 28px·아래 56px)이 크므로 이 페이지에서만 줄인다 */
    main { padding-top: 10px !important; padding-bottom: 12px !important; }

    .pdf-page {
        width: 100%; max-width: 1100px; margin: 0 auto;
        padding: 0 12px;
    }
    .pdf-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 4px 0 8px; border-bottom: 1px solid #e5e9e6; margin-bottom: 8px;
        flex-wrap: wrap; gap: 10px;
    }
    .pdf-title {
        font-size: 1.05rem; color: var(--forest); font-weight: 700;
    }
    .pdf-title .subj {
        font-size: 0.82rem; color: #777; font-weight: 500; margin-right: 6px;
    }
    .pdf-actions {
        display: flex; gap: 6px; align-items: center;
    }
    .pdf-actions a, .pdf-actions button {
        text-decoration: none; padding: 7px 14px; border-radius: 7px;
        background: #e8f5df; color: var(--forest); font-size: 0.84rem;
        font-weight: 700; border: none; cursor: pointer; font-family: inherit;
    }
    .pdf-actions a:hover, .pdf-actions button:hover { background: #d4ebc8; }

    .pdf-notice {
        background: #fff8e1; border-left: 3px solid #f5b042;
        padding: 6px 12px; font-size: 0.78rem; color: #6b4d12;
        margin-top: 8px; border-radius: 4px;
    }

    .pdf-toolbar {
        display: flex; justify-content: center; align-items: center;
        gap: 10px; padding: 8px;
        background: #1b4332; color: #fff;
        border-radius: 8px 8px 0 0;
        font-size: 0.85rem;
    }
    .pdf-toolbar button {
        background: rgba(255,255,255,0.15); color: #fff;
        border: none; padding: 5px 10px; border-radius: 5px;
        cursor: pointer; font-size: 0.85rem; font-family: inherit;
        transition: background 0.15s;
    }
    .pdf-toolbar button:hover { background: rgba(255,255,255,0.25); }
    .pdf-toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
    .pdf-toolbar input[type=number] {
        width: 50px; padding: 4px 6px; border: none; border-radius: 4px;
        font-size: 0.85rem; text-align: center;
    }
    .pdf-toolbar .page-info { color: #d8eadc; }

    .pdf-canvas-wrap {
        background: #4a4a4a;
        border-radius: 0 0 8px 8px;
        padding: 12px;
        /* 위아래 여백을 줄인 만큼 본문을 키운다 (툴바·머리글·경고 문구를 뺀 나머지) */
        height: calc(100vh - 210px);
        min-height: 360px;
        overflow-y: auto;
        text-align: center;
        position: relative;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    }
    .pdf-canvas-wrap canvas {
        background: #fff;
        max-width: 100%;
        height: auto;
        pointer-events: none;
    }
    /* 쪽을 세로로 이어 붙인다. 가운데 정렬 + 쪽 사이 간격 */
    .pdf-canvas-wrap .pdf-page-frame {
        box-shadow: 0 4px 14px rgba(0,0,0,0.3);
        background: #fff;
        position: relative;
        margin: 0 auto 14px;
    }
    .pdf-canvas-wrap .pdf-page-frame:last-child { margin-bottom: 0; }
    .pdf-loading {
        color: #fff; padding: 40px; text-align: center;
        font-size: 0.95rem;
    }
    .pdf-error {
        color: #ffb4b4; padding: 40px; text-align: center;
        font-size: 0.95rem;
    }

    .pdf-canvas-wrap { position: relative; }

    /* 워터마크 — 각 PDF 페이지(canvas) 위에 개별 배치, 용지 가운데 정렬 */
    .pdf-page-frame {
        position: relative;
        display: inline-block;
        margin-bottom: 14px;
    }
    .pdf-page-frame .pdf-watermark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-30deg);
        color: rgba(0, 0, 0, 0.08);
        pointer-events: none;
        white-space: nowrap;
        z-index: 2;
        text-align: center;
        line-height: 1.2;
    }
    .pdf-page-frame .pdf-watermark .wm-main {
        display: block;
        font-size: 4.5rem;
        font-weight: 900;
    }
    .pdf-page-frame .pdf-watermark .wm-sub {
        display: block;
        font-size: 1.4rem;
        font-weight: 700;
        margin-top: 4px;
        color: rgba(0, 0, 0, 0.10);
    }

    @media (max-width: 768px) {
        main { padding-top: 6px !important; padding-bottom: 8px !important; }
        .pdf-canvas-wrap { padding: 8px; height: calc(100vh - 190px); }
        .pdf-title { font-size: 0.95rem; }
        .pdf-toolbar { flex-wrap: wrap; gap: 6px; padding: 6px; }
        .pdf-toolbar button { padding: 4px 8px; font-size: 0.78rem; }
        .pdf-page-frame .pdf-watermark .wm-main { font-size: 1.8rem; }
        .pdf-page-frame .pdf-watermark .wm-sub  { font-size: 0.7rem; }
    }
</style>
{% endblock %}

{% block content %}
<div class="pdf-page" id="pdfPage">
    <div class="pdf-header">
        <div class="pdf-title">
            <span class="subj">[{{ subject.name }}]</span>{{ material.title }}
        </div>
        <div class="pdf-actions">
            <a href="{% url 'main:subject_detail' subject.pk %}?tab=study">← 과목으로</a>
        </div>
    </div>

    <div class="pdf-toolbar">
        <button type="button" id="prevPage" title="이전">◀</button>
        <span class="page-info">
            <input type="number" id="pageNum" min="1" value="1" />
            / <span id="pageCount">-</span>
        </span>
        <button type="button" id="nextPage" title="다음">▶</button>
        <span style="margin: 0 8px; opacity: 0.5;">|</span>
        <button type="button" id="zoomOut" title="축소">－</button>
        <span id="zoomLevel">100%</span>
        <button type="button" id="zoomIn" title="확대">＋</button>
        <button type="button" id="zoomFit" title="너비맞춤">↔</button>
        <span style="margin: 0 8px; opacity: 0.5;">|</span>
        <button type="button" id="printBtn" title="인쇄">🖨 인쇄</button>
    </div>

    <div class="pdf-canvas-wrap" id="canvasWrap" data-watermark="한울회 A+ 학습 시스템">
        <div class="pdf-loading" id="pdfLoading">📄 PDF 로딩 중...</div>
    </div>

    <div class="pdf-notice">
        ⚠️ 본 자료는 학습 목적의 열람·인쇄만 가능합니다. 다운로드·복제는 제한되어 있습니다.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs" type="module"></script>
<script type="module">
    import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs';

    const PDF_URL = '{% url "main:material_stream" subject.pk material.pk %}';
    // 인쇄 워터마크용 사용자명·자료ID·시각 (인쇄물 유출 추적)
    const WATERMARK_MAIN = '한울회 A+ 학습 시스템';
    const WATERMARK_USER = '{{ request.user.first_name|default:request.user.username|escapejs }}';
    function watermarkSub() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth()+1).padStart(2,'0');
        const d = String(now.getDate()).padStart(2,'0');
        const hh = String(now.getHours()).padStart(2,'0');
        const mm = String(now.getMinutes()).padStart(2,'0');
        return WATERMARK_USER + ' · ' + y + '-' + m + '-' + d + ' ' + hh + ':' + mm;
    }
    const wrap = document.getElementById('canvasWrap');
    const loading = document.getElementById('pdfLoading');
    const pageNumInput = document.getElementById('pageNum');
    const pageCountSpan = document.getElementById('pageCount');
    const zoomLevelSpan = document.getElementById('zoomLevel');

    let pdfDoc = null;
    let currentPage = 1;
    // 1.0 = 화면 폭에 꼭 맞춤 (렌더 크기 = scale * fitScale)
    let scale = 1.0;
    let pageSlots = [];        // 쪽마다 { frame, canvas, rendered, rendering }
    let fitScale = 1;          // 폭 맞춤 배율 (렌더 크기 = scale * fitScale)
    let scrollTimer = null;

    /* 전체 쪽을 세로로 이어 붙인다. 114쪽짜리도 있어 한 번에 다 그리면 메모리가
       감당하지 못하므로, 빈 칸(frame)만 미리 만들어 두고 화면 근처의 쪽만 그린다.
       멀어진 쪽은 canvas 를 비워 메모리를 돌려준다. */

    async function layoutPages() {
        if (!pdfDoc) return;
        wrap.querySelectorAll('.pdf-page-frame').forEach(f => f.remove());
        if (loading) loading.style.display = 'none';
        pageSlots = [];

        // 첫 쪽 크기로 폭 맞춤 배율을 정한다(대개 모든 쪽이 같은 규격이다)
        const first = await pdfDoc.getPage(1);
        const base = first.getViewport({ scale: 1 });
        const wrapWidth = wrap.clientWidth - 32;
        fitScale = wrapWidth / base.width;

        for (let n = 1; n <= pdfDoc.numPages; n++) {
            const page = await pdfDoc.getPage(n);
            const vp = page.getViewport({ scale: scale * fitScale });
            const frame = document.createElement('div');
            frame.className = 'pdf-page-frame';
            frame.dataset.page = n;
            frame.style.width = Math.floor(vp.width) + 'px';
            frame.style.height = Math.floor(vp.height) + 'px';

            const canvas = document.createElement('canvas');
            canvas.style.display = 'block';
            frame.appendChild(canvas);
            frame.appendChild(makeWatermark());
            wrap.appendChild(frame);

            pageSlots.push({ frame: frame, canvas: canvas, rendered: false, rendering: false });
        }
        zoomLevelSpan.textContent = Math.round(scale * 100) + '%';
        renderVisible();
    }

    function makeWatermark() {
        const wm = document.createElement('span');
        wm.className = 'pdf-watermark';
        const wmMain = document.createElement('span');
        wmMain.className = 'wm-main';
        wmMain.textContent = WATERMARK_MAIN;
        const wmSub = document.createElement('span');
        wmSub.className = 'wm-sub';
        wmSub.textContent = watermarkSub();
        wm.appendChild(wmMain);
        wm.appendChild(wmSub);
        return wm;
    }

    async function drawPage(n) {
        const slot = pageSlots[n - 1];
        if (!slot || slot.rendered || slot.rendering) return;
        slot.rendering = true;

        const page = await pdfDoc.getPage(n);
        const vp = page.getViewport({ scale: scale * fitScale });
        // 고해상도 대응 — 확대했을 때 픽셀이 깨지지 않게 추가 oversample
        const dpr = window.devicePixelRatio || 1;
        const outputScale = dpr * Math.min(Math.max(scale, 1), 2);

        const canvas = slot.canvas;
        canvas.width = Math.floor(vp.width * outputScale);
        canvas.height = Math.floor(vp.height * outputScale);
        canvas.style.width = Math.floor(vp.width) + 'px';
        canvas.style.height = Math.floor(vp.height) + 'px';

        await page.render({
            canvasContext: canvas.getContext('2d'),
            viewport: vp,
            transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null,
        }).promise;

        slot.rendered = true;
        slot.rendering = false;
    }

    /* 화면에 보이는 쪽과 앞뒤 한 쪽씩 그린다. 그보다 멀어진 쪽은 비운다. */
    function renderVisible() {
        if (!pdfDoc || !pageSlots.length) return;
        const top = wrap.scrollTop;
        const bottom = top + wrap.clientHeight;

        pageSlots.forEach((slot, i) => {
            const a = slot.frame.offsetTop;
            const b = a + slot.frame.offsetHeight;
            // 화면 위아래로 한 화면씩 여유를 둬 스크롤이 빈 칸을 만나지 않게 한다
            const near = b > top - wrap.clientHeight && a < bottom + wrap.clientHeight;
            if (near) {
                drawPage(i + 1);
            } else if (slot.rendered) {
                // 멀어진 쪽은 canvas 를 비워 메모리를 돌려준다 (틀은 그대로 둔다)
                slot.canvas.width = 0;
                slot.canvas.height = 0;
                slot.rendered = false;
            }
        });

        // 화면 위쪽 경계에 걸린 쪽을 지금 보는 쪽으로 삼는다
        let firstVisible = pageSlots.length;
        for (let i = 0; i < pageSlots.length; i++) {
            const f = pageSlots[i].frame;
            if (f.offsetTop + f.offsetHeight > top + 40) { firstVisible = i + 1; break; }
        }
        if (firstVisible !== currentPage) {
            currentPage = firstVisible;
            if (document.activeElement !== pageNumInput) pageNumInput.value = currentPage;
        }
    }

    function goToPage(n) {
        const slot = pageSlots[n - 1];
        if (!slot) return;
        wrap.scrollTo({ top: slot.frame.offsetTop - 8, behavior: 'smooth' });
    }

    wrap.addEventListener('scroll', () => {
        if (scrollTimer) clearTimeout(scrollTimer);
        scrollTimer = setTimeout(renderVisible, 80);
    });

    document.getElementById('prevPage').addEventListener('click', () => {
        if (currentPage > 1) goToPage(currentPage - 1);
    });
    document.getElementById('nextPage').addEventListener('click', () => {
        if (pdfDoc && currentPage < pdfDoc.numPages) goToPage(currentPage + 1);
    });
    pageNumInput.addEventListener('change', () => {
        const n = parseInt(pageNumInput.value, 10);
        if (pdfDoc && n >= 1 && n <= pdfDoc.numPages) goToPage(n);
        else pageNumInput.value = currentPage;
    });

    /* 줌은 모든 쪽의 틀 크기를 다시 잡아야 해서 통째로 다시 배치한다.
       보던 자리를 잃지 않도록 배치 뒤 그 쪽으로 되돌아간다. */
    async function rezoom(v) {
        const keep = currentPage;
        scale = v;
        await layoutPages();
        goToPage(keep);
    }
    document.getElementById('zoomIn').addEventListener('click', () => {
        rezoom(Math.min(scale + 0.2, 3.0));
    });
    document.getElementById('zoomOut').addEventListener('click', () => {
        rezoom(Math.max(scale - 0.2, 0.5));
    });
    document.getElementById('zoomFit').addEventListener('click', () => {
        rezoom(1.0);
    });

    // 인쇄: 숨겨진 iframe에 페이지 이미지를 모아 contentWindow.print() 호출
    // (모바일에서는 window.open 팝업 차단 우려가 있어 iframe 방식 사용)
    document.getElementById('printBtn').addEventListener('click', async () => {
        if (!pdfDoc) return;
        const btn = document.getElementById('printBtn');
        btn.disabled = true;
        const orig = btn.textContent;
        btn.textContent = '⏳ 준비 중...';

        // 서버에 인쇄 시도 로그 전송 (실패해도 인쇄는 진행)
        try {
            fetch('{% url "main:material_print_log" subject.pk material.pk %}', {
                method: 'POST',
                headers: {'X-CSRFToken': '{{ csrf_token }}', 'X-Requested-With': 'XMLHttpRequest'},
                credentials: 'same-origin',
            }).catch(function() {});
        } catch (e) {}

        // 기존 iframe이 있으면 제거
        const oldFrame = document.getElementById('printFrame');
        if (oldFrame) oldFrame.remove();

        // 숨겨진 인쇄용 iframe 생성
        const frame = document.createElement('iframe');
        frame.id = 'printFrame';
        frame.style.cssText = 'position:fixed; right:0; bottom:0; width:0; height:0; border:0; visibility:hidden;';
        document.body.appendChild(frame);

        try {
            const fdoc = frame.contentDocument || frame.contentWindow.document;
            fdoc.open();
            fdoc.write(`<!DOCTYPE html>
                <html><head><meta charset="utf-8"><title>{{ material.title|escapejs }}</title>
                <style>
                    @page { margin: 10mm; }
                    html, body { margin: 0; padding: 0; }
                    img { display: block; width: 100%; page-break-after: always; }
                    img:last-child { page-break-after: auto; }
                </style></head><body><div id="container"></div></body></html>`);
            fdoc.close();
            const container = fdoc.getElementById('container');

            const sub = watermarkSub();
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                btn.textContent = `⏳ ${i}/${pdfDoc.numPages}`;
                const page = await pdfDoc.getPage(i);
                const viewport = page.getViewport({ scale: 2.0 });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                const ctx2 = canvas.getContext('2d');
                await page.render({ canvasContext: ctx2, viewport }).promise;

                // 워터마크 합성 (캔버스 정중앙, -30도 회전)
                ctx2.save();
                ctx2.translate(canvas.width / 2, canvas.height / 2);
                ctx2.rotate(-Math.PI / 6);  // -30deg
                ctx2.fillStyle = 'rgba(0, 0, 0, 0.08)';
                ctx2.font = '900 ' + Math.round(canvas.width * 0.06) + 'px sans-serif';
                ctx2.textAlign = 'center';
                ctx2.textBaseline = 'middle';
                ctx2.fillText(WATERMARK_MAIN, 0, 0);
                // 부제목(사용자명·시각) — 작게
                ctx2.font = '700 ' + Math.round(canvas.width * 0.025) + 'px sans-serif';
                ctx2.fillStyle = 'rgba(0, 0, 0, 0.10)';
                ctx2.fillText(sub, 0, Math.round(canvas.width * 0.055));
                ctx2.restore();

                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                const img = fdoc.createElement('img');
                img.src = dataUrl;
                container.appendChild(img);
                // canvas 메모리 해제
                canvas.width = 0;
                canvas.height = 0;
            }

            // 이미지 로드 완료 대기
            const imgs = container.querySelectorAll('img');
            await Promise.all(Array.from(imgs).map(img =>
                img.complete ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = r; })
            ));

            // 인쇄 호출 (다음 tick으로 미뤄 모바일 안정성 확보)
            setTimeout(() => {
                try {
                    frame.contentWindow.focus();
                    frame.contentWindow.print();
                } catch (err) {
                    console.error('print() 실패:', err);
                    alert('이 기기에서는 인쇄를 지원하지 않거나 차단되었습니다.');
                }
            }, 200);
        } catch (err) {
            console.error('인쇄 준비 실패:', err);
            alert('인쇄 준비에 실패했습니다: ' + (err.message || err));
        } finally {
            btn.disabled = false;
            btn.textContent = orig;
        }
    });

    // 키보드 네비게이션
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            e.preventDefault();
            if (currentPage > 1) goToPage(currentPage - 1);
        } else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
            e.preventDefault();
            if (pdfDoc && currentPage < pdfDoc.numPages) goToPage(currentPage + 1);
        }
    });

    // PDF 로드
    // disableRange/disableStream: Django FileResponse가 HTTP Range 요청을 제대로
    // 처리하지 못해 큰 파일에서 'Bad end offset' 에러 발생 → 한 번에 전체 다운로드
    try {
        if (loading) loading.textContent = '📄 PDF 다운로드 중... (큰 파일은 시간이 걸릴 수 있습니다)';
        const loadingTask = pdfjsLib.getDocument({
            url: PDF_URL,
            withCredentials: true,
            disableRange: true,
            disableStream: true,
            disableAutoFetch: true,
        });
        loadingTask.onProgress = function(p) {
            if (loading && p.total) {
                const pct = Math.round(p.loaded / p.total * 100);
                loading.textContent = `📄 다운로드 중... ${pct}%`;
            }
        };
        pdfDoc = await loadingTask.promise;
        pageCountSpan.textContent = pdfDoc.numPages;
        pageNumInput.max = pdfDoc.numPages;
        await layoutPages();
    } catch (err) {
        console.error('PDF 로드 실패:', err);
        wrap.innerHTML = '<div class="pdf-error">PDF를 불러올 수 없습니다.<br><small>' + (err.message || '') + '</small></div>';
    }
</script>

<script>
(function() {
    // 우클릭 차단 (페이지 전체)
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    });
    // 다운로드/저장/소스보기/개발자도구 단축키 차단 (인쇄 Ctrl+P 는 허용)
    document.addEventListener('keydown', function(e) {
        var key = (e.key || '').toLowerCase();
        if ((e.ctrlKey || e.metaKey) && (key === 's' || key === 'u' || key === 'a' || key === 'c')) {
            // 입력 필드 안에서는 허용
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            e.preventDefault();
            return false;
        }
        if (key === 'f12' || (e.ctrlKey && e.shiftKey && (key === 'i' || key === 'j' || key === 'c'))) {
            e.preventDefault();
        }
    });
    // 드래그 차단
    document.addEventListener('dragstart', function(e) {
        e.preventDefault();
    });
})();
</script>
{% endblock %}
